<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Charts</title>
<meta name="theme-color" content="#0e0f11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e0f11'/%3E%3Cpath d='M6 22l6-7 5 4 9-11' stroke='%232962ff' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0e0f11; --bar:#131418; --line:#24262c; --hover:#1e2027; --sel:#1b2133;
  --text:#d1d4dc; --dim:#868993; --faint:#5d606b;
  --accent:#2962ff; --up:#089981; --down:#f23645;
  --font:-apple-system,BlinkMacSystemFont,"Trebuchet MS",Roboto,Ubuntu,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.35 var(--font);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-rows:44px 1fr;height:100dvh}

/* top bar */
.top{display:flex;align-items:center;gap:2px;padding:0 6px;background:var(--bar);border-bottom:1px solid var(--line);min-width:0}
.tb{display:flex;align-items:center;gap:6px;height:34px;padding:0 9px;border-radius:6px;color:var(--text);white-space:nowrap}
.tb:hover{background:var(--hover)}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
.sym{font-weight:700;font-size:14px;gap:8px;min-width:0}
.sym .ic{width:22px;height:22px}
.tfs{display:flex}
.tfs .tb{padding:0 8px;color:var(--dim)}
.tfs .tb.on{color:var(--text);background:var(--hover)}
.grow{flex:1}
.sync{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px;padding:0 8px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.dot.ok{background:var(--up)} .dot.busy{background:#f5a623} .dot.err{background:var(--down)}

/* main area */
.main{display:grid;grid-template-columns:46px 1fr 360px;min-height:0;position:relative}
.tools{background:var(--bar);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;overflow-y:auto}
.tools.off{pointer-events:none;opacity:.35}
.tool{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--text);flex:none}
.tool:hover{background:var(--hover)}
.tool.on{color:#5b8cff;background:var(--sel)}
.tools hr{width:26px;border:0;border-top:1px solid var(--line);margin:5px 0;flex:none}
.stage{position:relative;min-width:0;min-height:0;background:var(--bg)}
#kc,#alt{position:absolute;inset:0}
#alt iframe{border:0;width:100%;height:100%;display:block}
.banner{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#1e222d;border:1px solid var(--line);color:var(--dim);
  padding:6px 8px 6px 12px;border-radius:6px;font-size:12px;z-index:5;display:flex;gap:10px;align-items:center;width:max-content;max-width:calc(100% - 24px)}
.banner b{color:var(--text);font-weight:600}
.banner button{color:#5b8cff;font-weight:600;white-space:nowrap;display:flex}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);pointer-events:none;z-index:4}
.fab{position:absolute;z-index:6;display:none;align-items:center;gap:6px;background:#1e222d;border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.4)}
#delSel{left:50%;bottom:14px;transform:translateX(-50%);color:var(--down)}
#delSel.show{display:flex}

/* watchlist */
.wp{background:var(--bar);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.wtop{display:flex;align-items:center;height:42px;padding:0 6px 0 12px;border-bottom:1px solid var(--line);flex:none}
.wtop .t{font-weight:700;font-size:14px;flex:1}
.wtop .tb{height:30px;padding:0 7px;color:var(--dim)}
.wtop .tb:hover{color:var(--text)}
.wcols,.row{display:grid;grid-template-columns:minmax(0,1fr) 82px 70px 62px;align-items:center;column-gap:6px}
.wcols{padding:6px 12px;color:var(--faint);font-size:11px;border-bottom:1px solid var(--line);flex:none}
.wcols span:not(:first-child),.row .n{text-align:right}
.wl{overflow-y:auto;flex:1;overscroll-behavior:contain}
.grp{display:flex;align-items:center;gap:6px;padding:12px 12px 5px;color:var(--dim);font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;user-select:none}
.grp svg{width:14px;height:14px;transition:transform .15s}
.grp.closed svg{transform:rotate(-90deg)}
.row{padding:0 12px;height:34px;cursor:pointer;position:relative;border-left:2px solid transparent}
.row:hover{background:var(--hover)}
.row.on{background:var(--sel);border-left-color:var(--accent)}
.row .s{display:flex;align-items:center;gap:8px;min-width:0}
.row .s b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.row .n{font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .x{position:absolute;right:6px;top:7px;width:20px;height:20px;border-radius:4px;display:none;align-items:center;justify-content:center;background:#2a2e39;color:var(--dim)}
.row .x svg{width:14px;height:14px}
.row .pct:empty{background:none!important}
.row:hover .x{display:flex}
.row.drag{opacity:.4}
.row.over{box-shadow:inset 0 2px 0 var(--accent)}
.up{color:var(--up)} .down{color:var(--down)}
.flash-up{animation:fu .9s}.flash-down{animation:fd .9s}
@keyframes fu{0%{color:#26c99e}100%{color:inherit}}
@keyframes fd{0%{color:#ff5c6c}100%{color:inherit}}

/* coin icons */
.ic{width:18px;height:18px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;overflow:hidden;background:#2a2e39}
.ic img{width:100%;height:100%;object-fit:cover}

/* modals */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:70px 16px 16px}
.dlg{background:#1e222d;border:1px solid #2f3341;border-radius:10px;width:min(620px,100%);max-height:calc(100dvh - 100px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.5);overflow:hidden}
.dh{display:flex;align-items:center;padding:14px 12px 10px 16px;font-size:16px;font-weight:700;flex:none}
.dh .tb{height:30px;padding:0 6px;color:var(--dim)}
.sbox{display:flex;align-items:center;gap:8px;margin:0 16px 10px;padding:0 10px;height:40px;border:1px solid #363a45;border-radius:6px;color:var(--dim);flex:none}
.sbox:focus-within{border-color:var(--accent)}
.sbox input{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:15px;min-width:0}
.chips{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto;flex:none}
.chip{padding:5px 11px;border-radius:14px;background:#2a2e39;color:var(--dim);font-size:12px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--text);color:#131722}
.list{overflow-y:auto;border-top:1px solid #2f3341;flex:1;overscroll-behavior:contain}
.sr{display:grid;grid-template-columns:28px minmax(0,1fr) auto 32px;align-items:center;gap:10px;padding:8px 10px 8px 16px;cursor:pointer;border-bottom:1px solid #262a35}
.sr:hover,.sr.sel{background:#2a2e39}
.sr .ic{width:24px;height:24px;font-size:10px}
.sr b{font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr .d{color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr .r{text-align:right;font-size:12px;color:var(--dim);white-space:nowrap}
.sr .r .p{color:var(--text);font-size:13px;font-variant-numeric:tabular-nums}
.sr .add{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.sr .add:hover{background:#363a45;color:var(--text)}
.sr .add.in{color:#5b8cff}
.empty{padding:22px 16px;color:var(--dim);text-align:center}
.sec{padding:12px 16px 6px;color:var(--dim);font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.ir{display:flex;align-items:center;gap:12px;padding:9px 16px;cursor:pointer;border-bottom:1px solid #262a35}
.ir:hover{background:#2a2e39}
.ir b{font-weight:600;min-width:72px}
.ir .d{color:var(--dim);font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 16px;border-bottom:1px solid #262a35;flex-wrap:wrap}
.act b{min-width:72px}
.act input[type=text]{width:120px;background:#131722;border:1px solid #363a45;border-radius:5px;color:var(--text);padding:5px 8px;font:inherit}
.act input[type=color]{width:24px;height:24px;border:1px solid #363a45;border-radius:4px;padding:0;background:none;cursor:pointer}
.act .grow{flex:1}
.act .tb{height:28px;padding:0 6px;color:var(--dim)}
.act .tb:hover{color:var(--text)}
.act.hid b,.act.hid input{opacity:.45}
.form{padding:4px 16px 18px;overflow-y:auto}
.form h4{margin:16px 0 8px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.frow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.frow label{display:flex;align-items:center;gap:8px}
.frow input[type=color]{width:34px;height:28px;border:1px solid #363a45;border-radius:5px;padding:0;background:none;cursor:pointer}
.seg{display:inline-flex;border:1px solid #363a45;border-radius:6px;overflow:hidden}
.seg button{padding:7px 12px;color:var(--dim)}
.seg button.on{background:#363a45;color:var(--text)}
.btn{padding:8px 14px;border-radius:6px;background:#2a2e39;font-weight:600}
.btn:hover{background:#363a45}
.btn.pri{background:var(--accent);color:#fff}
.btn.pri:hover{background:#1e53e5}
.note{color:var(--dim);font-size:12px;line-height:1.5;margin:0 0 10px}
.qr{background:#fff;padding:8px;border-radius:6px;display:inline-block;line-height:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1e222d;border:1px solid #2f3341;padding:9px 14px;border-radius:8px;z-index:90;max-width:calc(100% - 32px);font-size:13px}
.menu{position:fixed;z-index:60;background:#1e222d;border:1px solid #2f3341;border-radius:8px;padding:4px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.menu button{display:block;width:100%;text-align:left;padding:9px 18px;border-radius:5px}
.menu button:hover,.menu button.on{background:#2a2e39}
.tabs{display:none}

/* phone */
@media (max-width:820px){
  .app{grid-template-rows:46px 1fr calc(54px + env(safe-area-inset-bottom))}
  .top{padding:0 4px}
  .tfs,.hide-m,.sync span{display:none}
  .main{grid-template-columns:1fr}
  .tools{position:absolute;left:0;right:0;bottom:0;z-index:7;flex-direction:row;height:52px;padding:0 6px;border-right:0;border-top:1px solid var(--line);overflow-x:auto;overflow-y:hidden;display:none}
  .tools.open{display:flex}
  .tools hr{width:0;height:26px;border:0;border-left:1px solid var(--line);margin:0 4px}
  .tool{width:42px;height:42px}
  #penFab{display:flex;left:12px;bottom:14px;padding:11px;border-radius:50%}
  #penFab.open{bottom:66px;color:#5b8cff}
  #delSel{bottom:66px}
  .wp{position:absolute;inset:0;z-index:20;border-left:0}
  .app:not(.show-w) .wp{display:none}
  .wcols{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto 76px;column-gap:12px;height:58px;padding:0 14px;border-left:0;border-bottom:1px solid #1a1c22}
  .row.on{background:none}
  .row .s{gap:12px}
  .row .s b{font-size:15px}
  .row .s .ic{width:30px;height:30px;font-size:12px}
  .row .ex{display:block;color:var(--dim);font-size:12px;font-weight:400}
  .row .n{font-size:15px}
  .row .n.chg{display:none}
  .row .pct{justify-self:end;padding:6px 0;width:76px;border-radius:5px;text-align:center!important;color:#fff;font-weight:600;font-size:13px;background:#2a2e39}
  .row .pct.up{background:var(--up);color:#fff} .row .pct.down{background:var(--down);color:#fff}
  .row:hover{background:none}
  .row .x{display:none!important}
  .wp.edit .row{grid-template-columns:minmax(0,1fr) 40px}
  .wp.edit .row .n{display:none}
  .wp.edit .row .x{display:flex!important;position:static;width:32px;height:32px;justify-self:end;color:var(--down)}
  .tabs{display:flex;background:var(--bar);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--dim)}
  .tabs button.on{color:var(--text)}
  .scrim{padding:0;align-items:stretch}
  .dlg{width:100%;max-height:none;height:100%;border-radius:0;border:0}
  .sbox input{font-size:16px}
  .sym{font-size:15px;padding:0 6px}
  .sym .px{font-weight:400;font-size:13px;color:var(--dim)}
  .banner{top:8px;left:8px;right:8px;transform:none;width:auto}
}
@media (min-width:821px){ .row .ex{display:none} .m-only{display:none!important} #penFab{display:none!important} }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="tb sym" id="symBtn" title="Symbol search"><span class="ic" id="symIc"></span><span id="symName"></span><span class="px m-only" id="symPx"></span></button>
    <div class="sep hide-m"></div>
    <div class="tfs" id="tfs"></div>
    <button class="tb m-only" id="tfBtn"></button>
    <div class="sep hide-m"></div>
    <button class="tb" id="indBtn" title="Indicators"><svg class="i" viewBox="0 0 24 24"><path d="M3 20l5-7 4 3 7-10"/><path d="M15 6h4v4"/></svg><span class="hide-m">Indicators</span></button>
    <div class="sep hide-m"></div>
    <button class="tb hide-m" id="viewBtn" title="Switch between your chart (drawings save) and the TradingView chart"></button>
    <div class="grow"></div>
    <div class="sync" id="sync"><i class="dot" id="syncDot"></i><span id="syncTxt"></span></div>
    <button class="tb" id="setBtn" title="Settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <div class="main">
    <nav class="tools" id="tools"></nav>
    <section class="stage" id="stage">
      <div id="kc"></div>
      <div id="alt" hidden></div>
      <div class="loading" id="loading" hidden>Loading…</div>
      <div class="banner" id="banner" hidden></div>
      <button class="fab" id="penFab" title="Drawing tools"><svg class="i" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 7l3 3"/></svg></button>
      <button class="fab" id="delSel"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Delete drawing</button>
    </section>
    <aside class="wp" id="wp">
      <div class="wtop">
        <span class="t">Watchlist</span>
        <button class="tb m-only" id="editBtn">Edit</button>
        <button class="tb" id="wAdd" title="Add symbol"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <div class="wcols"><span>Symbol</span><span>Last</span><span>Chg</span><span>Chg%</span></div>
      <div class="wl" id="wl"></div>
    </aside>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="w"><svg class="i" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Watchlist</button>
    <button data-tab="c" class="on"><svg class="i" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>Chart</button>
    <button data-tab="s"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Search</button>
    <button data-tab="i"><svg class="i" viewBox="0 0 24 24"><path d="M3 20l5-7 4 3 7-10"/></svg>Indicators</button>
  </nav>
</div>

<div class="scrim" id="searchDlg" hidden>
  <div class="dlg">
    <div class="dh"><span>Symbol search</span><span class="grow"></span><button class="tb" data-close title="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <label class="sbox"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="Symbol, name, or contract address" autocomplete="off" spellcheck="false" autocapitalize="characters"></label>
    <div class="chips" id="chips"></div>
    <div class="list" id="results"></div>
  </div>
</div>

<div class="scrim" id="indDlg" hidden>
  <div class="dlg">
    <div class="dh"><span>Indicators</span><span class="grow"></span><button class="tb" data-close title="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <label class="sbox"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="iq" placeholder="Search indicators" autocomplete="off" spellcheck="false"></label>
    <div class="list" id="indList"></div>
  </div>
</div>

<div class="scrim" id="setDlg" hidden>
  <div class="dlg">
    <div class="dh"><span>Settings</span><span class="grow"></span><button class="tb" data-close title="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="form" id="setForm"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/klinecharts@10.1.0/dist/umd/klinecharts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://s3.tradingview.com/tv.js" async></script>
<script>
(() => {
'use strict';
const SYNC_URL = '';   // set once the sync worker is deployed
const K = window.klinecharts;
const $ = (s, r = document) => r.querySelector(s);
const isPhone = () => matchMedia('(max-width:820px)').matches;
function h(tag, props, ...kids){
  const e = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'svg') e.innerHTML = v;          // only ever given the fixed icon strings below
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const svg = d => `<svg class="i" viewBox="0 0 24 24">${d}</svg>`;
const ICON = {
  cursor:'<path d="M6 3l12 9-5.5 1.2L16 20l-2.4 1-2.6-6.5L6 18z"/>',

function decimalsFor(p){ p = Math.abs(Number(p)); if (!isFinite(p) || p === 0) return 2;
  if (p >= 10) return 2; if (p >= 1) return 4; return Math.min(12, Math.max(4, Math.ceil(-Math.log10(p)) + 3)); }

function fmtNum(p, dec){ p = Number(p); if (!isFinite(p)) return '—';
  const a = Math.abs(p);

    const zeros = -Math.floor(Math.log10(a)) - 1;
    const sig = String(Math.round(a * 10 ** (zeros + 4))).slice(0, 4).replace(/0+$/, '') || '0';
    return (p < 0 ? '-' : '') + '0.0' + String(zeros).split('').map(d => SUBS[d]).join('') + sig;

const loader = {
  getBars: async ({type, timestamp, callback, symbol}) => {

    try {
      const {rows, more} = await SRC[srcOf(it)](it, tf, type === 'forward' ? timestamp : null);
      if (seq !== loadSeq) return;
      if (type === 'init') {
        if (!rows.length) throw new Error('no data');
        const dec = decimalsFor(rows[rows.length - 1].close);
        if (dec !== symbol.pricePrecision) { chart.setSymbol({pricePrecision: dec}); return; }   // reloads with the right precision
        $('#loading').hidden = true; $('#kc').style.visibility = '';

      callback(rows, {forward: more, backward: false});

      if (seq !== loadSeq) return;
      $('#loading').hidden = true;
      if (type !== 'init') return callback([], false);
      if (it.k === 'dex') showAlt(it, 'No price history for this pool on GeckoTerminal, so it opens in the DexScreener chart. Drawings there are not synced.');

  if (tool !== 'cursor' && name !== tool) chart.getOverlays({groupId:'u'}).forEach(o => { if (o.currentStep > 0) chart.removeOverlay({id:o.id}); });
  tool = name;
  document.querySelectorAll('.tool[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === name));

  const prev = S.draws[id];

    chart.createOverlay({name:o.name, groupId:'u', points:o.points, extendData:o.extendData, lock:drawLock, visible:!drawHidden, mode: magnet ? 'weak_magnet' : 'normal', ...overlayCallbacks()});

const prices = {};
let dragId = null;

function renderWatch(){
  const box = $('#wl'), top = box.scrollTop; box.textContent = '';
  const cur = idOf(curItem());
  const groups = [];
  for (const it of M().watch) { const g = it.g || 'Added'; let G = groups.find(x => x.g === g); if (!G) groups.push(G = {g, items:[]}); G.items.push(it); }
  if (!groups.length) box.append(h('div', {class:'empty', text:'Your watchlist is empty. Use + to add symbols.'}));

        h('div', {class:'s'}, iconEl(it), h('div', {style:'min-width:0'}, h('b', {text: it.n}), h('span', {class:'ex', text: it.k === 'dex' ? (it.chainName || it.c) : (it.x || exOf(it))}))),
        h('span', {class:'n', text: q ? fmtNum(q.p) : '—', 'data-px':id}),
        h('span', {class:'n chg ' + dir, text: q && isFinite(q.ch) ? fmtSigned(q.ch, decimalsFor(q.p)) : ''}),
        h('span', {class:'n pct ' + dir, text: q && isFinite(q.c) ? fmtPct(q.c) : (srcOf(it) === 'tv' ? '' : '')}),
        h('button', {class:'x', title:'Remove from watchlist', svg:svg(ICON.x), onclick:e => { e.stopPropagation(); M().watch = M().watch.filter(w => idOf(w) !== id); touchMeta(); renderWatch(); refreshPrices(); }}),
      );

function updatePriceCells(id, prev){

let tickWs = null, tickKey = '';
let binIds = {};
function binanceSyms(){ binIds = {}; for (const it of [...M().watch, curItem()]) { const b = binSym(it); if (b) (binIds[b] ||= new Set()).add(idOf(it)); } return Object.keys(binIds); }
function setBin(sym, c, o){ for (const id of (binIds[sym] || [])) setPrice(id, c, o ? (c - o) / o * 100 : 0, c - o); }
function connectTicker(){
  const syms = binanceSyms(), key = syms.join(',');
  if (key === tickKey && tickWs) return;
  tickKey = key; if (tickWs) { tickWs.onclose = null; tickWs.close(); tickWs = null; }
  if (!syms.length) return;
  const ws = tickWs = new WebSocket('wss://data-stream.binance.vision/stream?streams=' + syms.map(s => s.toLowerCase() + '@miniTicker').join('/'));
  ws.onmessage = e => { const d = JSON.parse(e.data).data; if (d) setBin(d.s, +d.c, +d.o); };
  ws.onclose = () => { if (tickWs === ws) { tickWs = null; setTimeout(connectTicker, 4000); } };
}
async function refreshPrices(){
  const list = [...M().watch]; if (!list.some(w => idOf(w) === idOf(curItem()))) list.push(curItem());
  const jobs = [];
  const bn = binanceSyms();
  const bnRow = r => setBin(r.symbol, +r.lastPrice, +r.openPrice);
  if (bn.length) jobs.push(getJSON('https://data-api.binance.vision/api/v3/ticker/24hr?type=MINI&symbols=' + encodeURIComponent(JSON.stringify(bn)))
    .then(rows => rows.forEach(bnRow))
    .catch(() => Promise.all(bn.map(s => getJSON('https://data-api.binance.vision/api/v3/ticker/24hr?type=MINI&symbol=' + s).then(bnRow).catch(() => {})))));
  const byChain = {};
  for (const it of list) if (it.k === 'dex') (byChain[it.c] ||= []).push(it);
  for (const [c, its] of Object.entries(byChain)) for (let i = 0; i < its.length; i += 30) {
    const chunk = its.slice(i, i + 30);
    jobs.push(getJSON(`https://api.dexscreener.com/latest/dex/pairs/${encodeURIComponent(c)}/${chunk.map(x => encodeURIComponent(x.p)).join(',')}`).then(j => {
      for (const p of (j.pairs || [])) { const it = chunk.find(x => x.p.toLowerCase() === String(p.pairAddress).toLowerCase());
        if (it) { const pc = p.priceChange ? +p.priceChange.h24 : NaN, px = +p.priceUsd; setPrice(idOf(it), px, pc, isFinite(pc) ? px - px / (1 + pc / 100) : NaN); } }
    }).catch(() => {}));
  }
  await Promise.all(jobs);
  connectTicker();
}

let binAll = null, chip = 'all', srSel = 0, srRows = [], sSeq = 0;
const CHIPS = [['all','All'],['binance','Binance'],['dex','DEX tokens'],['tv','TradingView']];
const CHAIN_NAMES = {ethereum:'Ethereum',bsc:'BNB Chain',solana:'Solana',base:'Base',arbitrum:'Arbitrum',polygon:'Polygon',avalanche:'Avalanche',optimism:'Optimism',sui:'Sui',ton:'TON',tron:'Tron',hyperliquid:'Hyperliquid',hyperevm:'HyperEVM',unichain:'Unichain',abstract:'Abstract',sonic:'Sonic',blast:'Blast',linea:'Linea',zksync:'zkSync',mantle:'Mantle',pulsechain:'PulseChain',cronos:'Cronos',berachain:'Berachain'};
const chainName = c => CHAIN_NAMES[c] || (c ? c[0].toUpperCase() + c.slice(1) : '');
function renderChips(){ const cb = $('#chips'); cb.textContent = '';
  for (const [k, l] of CHIPS) cb.append(h('button', {class:'chip' + (k === chip ? ' on' : ''), text:l, onclick:() => { chip = k; renderChips(); runSearch($('#q').value); $('#q').focus(); }})); }
function openSearch(initial){
  $('#searchDlg').hidden = false; const q = $('#q'); q.value = initial || ''; q.focus();
  renderChips(); runSearch(q.value);
  if (!binAll) getJSON('https://data-api.binance.vision/api/v3/ticker/price').then(j => { binAll = j; if (!$('#searchDlg').hidden) runSearch($('#q').value); }).catch(() => { binAll = []; });
}
function closeDlgs(){ for (const d of ['#searchDlg','#indDlg','#setDlg']) $(d).hidden = true; if (isPhone() && (tabNow === 's' || tabNow === 'i')) setTab('c'); }
document.querySelectorAll('[data-close]').forEach(b => b.onclick = closeDlgs);
document.querySelectorAll('.scrim').forEach(s => s.addEventListener('mousedown', e => { if (e.target === s) closeDlgs(); }));
$('#symBtn').onclick = () => openSearch('');
$('#wAdd').onclick = () => openSearch('');
let qT;
$('#q').addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(() => runSearch($('#q').value), 220); });
$('#q').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!srRows.length) return; srSel = (srSel + (e.key === 'ArrowDown' ? 1 : -1) + srRows.length) % srRows.length; paintSel(); }
  else if (e.key === 'Enter') { if (srRows[srSel]) pickResult(srRows[srSel]); }
  else if (e.key === 'Escape') closeDlgs();
});
function paintSel(){ const rows = $('#results').querySelectorAll('.sr'); rows.forEach((r, i) => r.classList.toggle('sel', i === srSel)); rows[srSel] && rows[srSel].scrollIntoView({block:'nearest'}); }
const inWatch = it => M().watch.some(w => idOf(w) === idOf(it));
function toggleWatch(it){
  if (inWatch(it)) M().watch = M().watch.filter(w => idOf(w) !== idOf(it));
  else M().watch.push({...it, g: srcOf(it) === 'tv' ? 'Market' : 'My tokens'});
  touchMeta(); renderWatch(); refreshPrices();
}
function pickResult(r){ if (r.price) setPrice(idOf(r.item), r.price, r.chg, NaN); closeDlgs(); select(r.item); }
async function runSearch(text){
  const seq = ++sSeq; text = text.trim();
  const out = [], T = text.toUpperCase();
  const link = text.match(/dexscreener\.com\/([a-z0-9-]+)\/([A-Za-z0-9]+)/i);
  if (!text) {
    for (const it of M().watch) out.push({item:it, title:it.n, desc:it.x || it.chainName || '', right: prices[idOf(it)] ? fmtNum(prices[idOf(it)].p) : '', chg: prices[idOf(it)] ? prices[idOf(it)].c : NaN});
    return paint(out, seq, 'Your watchlist');
  }
  if ((chip === 'all' || chip === 'binance') && !link && binAll) {
    const quotes = ['USDT','USDC','FDUSD','BTC'], want = T.replace(/(USDT|USDC|USD)$/, '') || T, m = [];
    for (const r of binAll) { const s = r.symbol, qq = quotes.find(x => s.endsWith(x)); if (!qq) continue; const base = s.slice(0, -qq.length);
      if (base.startsWith(want) || s === T) m.push({s, base, qq, p:+r.price, score:(base === want ? 0 : 1) + quotes.indexOf(qq) * 0.1 + base.length * 0.01}); }
    m.sort((a, b) => a.score - b.score);
    for (const x of m.slice(0, chip === 'binance' ? 60 : 6))
      out.push({item:{k:'tv', s:'BINANCE:' + x.s, n:x.s, x:'Binance'}, title:x.s, desc:x.base + ' / ' + x.qq + ' · Binance spot', right:fmtNum(x.p), price:x.p});
  }
  if ((chip === 'all' || chip === 'tv') && !link && /^[A-Z0-9!._-]{1,20}:[A-Z0-9!._-]{1,30}$/.test(T)) {
    const [ex, sym] = T.split(':');
    out.push({item:{k:'tv', s:T, n:sym, x:ex[0] + ex.slice(1).toLowerCase()}, title:sym, desc:'TradingView · ' + T, right:'TradingView'});
  } else if (chip === 'tv') out.push({item:{k:'tv', s:'CAPITALCOM:DXY', n:'DXY', x:'Capitalcom'}, title:'Type EXCHANGE:SYMBOL', desc:'for markets outside Binance, e.g. CAPITALCOM:DXY, OANDA:XAUUSD, CRYPTOCAP:TOTAL2', right:''});
  paint(out, seq);
  if (chip !== 'all' && chip !== 'dex') return;
  try {
    const j = await getJSON('https://api.dexscreener.com/latest/dex/search?q=' + encodeURIComponent(link ? link[2] : text));
    if (seq !== sSeq) return;
    const vol = x => (x.volume && x.volume.h24) || 0, liq = x => (x.liquidity && x.liquidity.usd) || 0;
    const pairs = (j.pairs || []).sort((a, b) => (vol(b) - vol(a)) || (liq(b) - liq(a))).slice(0, chip === 'dex' ? 40 : 15);
    for (const p of pairs) {
      const n = (p.baseToken && p.baseToken.symbol || '?') + '/' + (p.quoteToken && p.quoteToken.symbol || '?');
      const img = p.info && typeof p.info.imageUrl === 'string' ? p.info.imageUrl : undefined;
      const it = {k:'dex', c:p.chainId, p:p.pairAddress, n, chainName:chainName(p.chainId), dex:p.dexId, img};
      out.push({item:it, title:n, price:+p.priceUsd, chg: p.priceChange ? +p.priceChange.h24 : NaN,
        desc:[p.baseToken && p.baseToken.name, chainName(p.chainId), p.dexId, shortAddr(p.baseToken && p.baseToken.address)].filter(Boolean).join(' · '),
        right: fmtNum(+p.priceUsd), sub: 'vol ' + (fmtUsd(vol(p)) || '0') + ' · liq ' + (fmtUsd(liq(p)) || '?')});
    }
  } catch {}
  paint(out, seq, null, true);
}
function paint(rows, seq, title, done){
  if (seq !== sSeq) return;
  srRows = rows; srSel = Math.min(srSel, Math.max(0, rows.length - 1));
  const box = $('#results'); box.textContent = '';
  if (title) box.append(h('div', {class:'sec', text:title}));
  if (!rows.length) { box.append(h('div', {class:'empty', text: done ? 'No matches' : 'Searching…'})); return; }
  rows.forEach((r, i) => {
    const add = h('button', {class:'add' + (inWatch(r.item) ? ' in' : ''), title:'Add to / remove from watchlist', svg:svg(inWatch(r.item) ? ICON.check : ICON.plus),
      onclick:e => { e.stopPropagation(); toggleWatch(r.item); add.classList.toggle('in', inWatch(r.item)); add.innerHTML = svg(inWatch(r.item) ? ICON.check : ICON.plus); }});
    box.append(h('div', {class:'sr' + (i === srSel ? ' sel' : ''), onclick:() => pickResult(r)},
      iconEl(r.item),
      h('div', {style:'min-width:0'}, h('b', {text:r.title}), h('div', {class:'d', text:r.desc || ''})),
      h('div', {class:'r'}, h('div', {class:'p', text:r.right || ''}), r.sub ? h('div', {text:r.sub}) : (isFinite(r.chg) ? h('div', {class: r.chg >= 0 ? 'up' : 'down', text:fmtPct(r.chg)}) : null)),
      add));
  });
}

// ---------- indicators dialog ----------
$('#indBtn').onclick = () => openInd();
function openInd(){ $('#indDlg').hidden = false; $('#iq').value = ''; renderInd(); if (!isPhone()) $('#iq').focus(); }
$('#iq').addEventListener('input', renderInd);
function applyInd(){ touchMeta(); if (mode === 'kc') buildIndicators(); else openChart(); }
function renderInd(){
  const box = $('#indList'); box.textContent = '';
  const q = $('#iq').value.trim().toLowerCase();
  if (!q && M().ind.length) {
    box.append(h('div', {class:'sec', text:'On your chart'}));
    for (const x of M().ind) {
      const lib = LIB[x.n];
      const row = h('div', {class:'act' + (x.hide ? ' hid' : '')}, h('b', {text:x.n}));
      if (lib.p.length) {
        const inp = h('input', {type:'text', value:x.p.join(', '), title:'Lengths / settings, comma separated', inputmode:'decimal'});
        inp.onchange = () => { const v = inp.value.split(/[,\s]+/).map(Number).filter(n => isFinite(n) && n > 0); if (v.length) { x.p = v; applyInd(); renderInd(); } };
        row.append(inp);
        if (['MA','EMA','SMA','RSI'].includes(x.n)) x.p.forEach((_, i) => {
          const c = h('input', {type:'color', value:x.c[i] || PALETTE[i % PALETTE.length], title:'Color of line ' + (i + 1)});
          c.onchange = () => { x.c[i] = c.value; applyInd(); }; row.append(c); });
      }
      row.append(h('span', {class:'grow'}),
        h('button', {class:'tb', title: x.hide ? 'Show' : 'Hide', svg:svg(x.hide ? ICON.eyeOff : ICON.eye), onclick:() => { x.hide = !x.hide; applyInd(); renderInd(); }}),
        h('button', {class:'tb', title:'Remove', svg:svg(ICON.trash), onclick:() => { M().ind = M().ind.filter(y => y !== x); applyInd(); renderInd(); }}));
      box.append(row);
    }
  }
  box.append(h('div', {class:'sec', text: q ? 'Results' : 'Add indicator'}));
  for (const [name, desc] of IND_LIB) {
    if (q && !(name.toLowerCase().includes(q) || desc.toLowerCase().includes(q))) continue;
    box.append(h('div', {class:'ir', onclick:() => {
      const lib = LIB[name];
      M().ind.push({id:uid(), n:name, p:[...lib.p], c:lib.p.map((_, i) => PALETTE[(i + M().ind.length) % PALETTE.length])});
      applyInd(); $('#iq').value = ''; renderInd(); toast(desc + ' added', 1400);
    }}, h('b', {text:name}), h('span', {class:'d', text:desc}), h('span', {svg:svg(ICON.plus), style:'color:var(--dim);display:flex'})));
  }
}

// ---------- settings ----------
$('#setBtn').onclick = openSettings;
function openSettings(){
  $('#setDlg').hidden = false;
  const f = $('#setForm'); f.textContent = '';
  const m = M();
  const up = h('input', {type:'color', value:m.up}), dn = h('input', {type:'color', value:m.down});
  const applyColors = () => { m.up = up.value; m.down = dn.value; touchMeta(); chart.setStyles(chartStyles()); if (mode !== 'kc') openChart(); };
  up.oninput = dn.oninput = applyColors;
  f.append(h('h4', {text:'Candle colors'}),
    h('div', {class:'frow'}, h('label', null, 'Up', up), h('label', null, 'Down', dn),
      h('button', {class:'btn', text:'White / blue', onclick:() => { up.value = '#f2f2ee'; dn.value = '#3b78b8'; applyColors(); }}),
      h('button', {class:'btn', text:'Green / red', onclick:() => { up.value = '#089981'; dn.value = '#f23645'; applyColors(); }})));
  const seg = h('div', {class:'seg'});
  for (const [v, l] of [['candle_solid','Candles'],['candle_up_stroke','Hollow'],['ohlc','Bars'],['area','Line']])
    seg.append(h('button', {class: m.ctype === v ? 'on' : '', text:l, onclick:() => { m.ctype = v; touchMeta(); chart.setStyles(chartStyles()); openSettings(); }}));
  f.append(h('h4', {text:'Chart type'}), seg);
  f.append(h('h4', {text:'Sync between PC and phone'}));
  if (!SYNC_URL) { f.append(h('p', {class:'note', text:'Sync is not set up yet. Everything is saved in this browser.'})); return; }
  const url = location.origin + location.pathname + '#k=' + S.key;
  f.append(h('p', {class:'note', text:'Your watchlist, indicators and drawings sync on their own. To get them on another device, scan this code with it or open the link there. Anyone with the link can see and change your charts, so keep it to yourself.'}));
  const row = h('div', {class:'frow', style:'align-items:flex-start'});
  if (window.qrcode) { const qr = qrcode(0, 'M'); qr.addData(url); qr.make(); const d = h('div', {class:'qr'}); d.innerHTML = qr.createSvgTag({cellSize:4, margin:0}); row.append(d); }
  row.append(h('div', {style:'display:flex;flex-direction:column;gap:8px'},
    h('button', {class:'btn pri', text:'Copy sync link', onclick:async () => { try { await navigator.clipboard.writeText(url); toast('Link copied. Open it on your other device.'); } catch { prompt('Copy this link', url); } }}),
    h('button', {class:'btn', text:'Sync now', onclick:() => pull(true)}),
    h('span', {class:'note', id:'syncInfo', text:syncInfo()})));
  f.append(row);
}

// ---------- sync ----------
let pushT = null, syncState = 'idle', lastSync = 0;
function syncInfo(){ return syncState === 'err' ? 'Last sync failed, retrying' : lastSync ? 'Synced at ' + new Date(lastSync).toLocaleTimeString() : 'Not synced yet'; }
function setSync(st){ syncState = st; $('#syncDot').className = 'dot' + (st === 'ok' ? ' ok' : st === 'busy' ? ' busy' : st === 'err' ? ' err' : '');
  $('#syncTxt').textContent = !SYNC_URL ? 'Saved on this device' : st === 'err' ? 'Sync error' : st === 'busy' ? 'Syncing…' : 'Synced';
  $('#sync').title = SYNC_URL ? syncInfo() : 'Everything is saved in this browser';
  const i = $('#syncInfo'); if (i) i.textContent = syncInfo(); }
function schedulePush(){ if (!SYNC_URL) return; setSync('busy'); clearTimeout(pushT); pushT = setTimeout(push, 1500); }
async function push(){
  try {
    const r = await fetch(SYNC_URL + '/v1/' + S.key, {method:'PUT', headers:{'content-type':'application/json'}, body: JSON.stringify({meta:S.meta, draws:S.draws})});
    if (!r.ok) throw 0; lastSync = Date.now(); setSync('ok');
  } catch { setSync('err'); clearTimeout(pushT); pushT = setTimeout(push, 15000); }
}
function merge(remote){
  let changed = false, needPush = false;
  const rt = remote.meta && remote.meta.t || 0, lt = S.meta.t || 0;
  if (rt > lt) { S.meta = cleanMeta(remote.meta); changed = true; } else if (lt > rt) needPush = true;
  const rd = remote.draws && typeof remote.draws === 'object' ? remote.draws : {};
  for (const [id, d] of Object.entries(rd)) { if (!d || !Array.isArray(d.o)) continue; const l = S.draws[id];
    if (!l || (d.t || 0) > (l.t || 0)) { S.draws[id] = d; changed = true; } else if ((l.t || 0) > (d.t || 0)) needPush = true; }
  for (const id of Object.keys(S.draws)) if (!rd[id]) needPush = true;
  return {changed, needPush};
}
async function pull(manual){
  if (!SYNC_URL) return;
  if (pushT && syncState === 'busy') return;   // a local change is about to upload
  setSync('busy');
  try {
    const r = await fetch(SYNC_URL + '/v1/' + S.key, {cache:'no-store'}); if (!r.ok) throw 0;
    const remote = await r.json();
    const before = JSON.stringify([S.meta, S.draws[idOf(curItem())]]);
    const {changed, needPush} = merge(remote || {});
    persist(); lastSync = Date.now(); setSync('ok');
    if (changed && JSON.stringify([S.meta, S.draws[idOf(curItem())]]) !== before) { chart.setStyles(chartStyles()); buildIndicators(); openChart(); refreshPrices(); }
    if (needPush) schedulePush();
    if (manual) toast('Synced', 1200);
  } catch { setSync('err'); }
}

// ---------- phone tabs ----------
let tabNow = 'c';
function setTab(t){
  tabNow = t;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  $('#app').classList.toggle('show-w', t === 'w');
  if (t === 's') openSearch('');
  if (t === 'i') openInd();
  if (t === 'c' || t === 'w') { $('#searchDlg').hidden = $('#indDlg').hidden = true; }
  if (t === 'c') requestAnimationFrame(() => chart.resize());
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
$('#penFab').onclick = () => { const o = $('#tools').classList.toggle('open'); $('#penFab').classList.toggle('open', o); if (!o) setTool('cursor'); };
$('#editBtn').onclick = () => { const on = $('#wp').classList.toggle('edit'); $('#editBtn').textContent = on ? 'Done' : 'Edit'; };

// ---------- start ----------
S = loadState();
const km = location.hash.match(/[#&]k=([\w-]{20,})/);
if (km) {   // opened from a sync link: adopt that key and take the synced copy
  if (km[1] !== S.key) { S.key = km[1]; S.meta.t = 0; for (const d of Object.values(S.draws)) d.t = 0; }
  history.replaceState(null, '', location.pathname);
}
persist();
chart.setStyles(chartStyles());
buildTools(); buildIndicators(); setSync('idle');
openChart();
refreshPrices();
setInterval(() => { if (!document.hidden) refreshPrices(); }, 30000);
if (SYNC_URL) { pull(); setInterval(() => { if (!document.hidden) pull(); }, 60000); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) { refreshPrices(); pull(); } });
new ResizeObserver(() => chart.resize()).observe($('#stage'));
})();
</script>
