<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Charts</title>
<meta name="theme-color" content="#111317">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e0f11'/%3E%3Cpath d='M6 22l6-7 5 4 9-11' stroke='%232962ff' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0c0e; --bar:#111317; --line:#1e2127; --line2:#262a31; --hover:#1a1d23; --sel:#16203a; --pop:#171a20;
  --text:#e6e8ec; --dim:#8b909a; --faint:#5b6069;
  --accent:#2962ff; --accent2:#5b8cff; --up:#22ab94; --down:#f23645;
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.35 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-rows:52px 1fr;height:100dvh}

/* top bar */
.top{display:flex;align-items:center;gap:4px;padding:0 8px;background:var(--bar);border-bottom:1px solid var(--line);min-width:0}
.tb{display:flex;align-items:center;gap:7px;height:34px;padding:0 10px;border-radius:7px;color:var(--dim);white-space:nowrap;font-weight:500}
.tb:hover{background:var(--hover);color:var(--text)}
.tb.on{color:var(--text)}
.sep{width:1px;height:22px;background:var(--line2);margin:0 6px;flex:none}
.sym{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px 0 6px;border-radius:8px;min-width:0}
.sym:hover{background:var(--hover)}
.sym .ic{width:26px;height:26px;font-size:12px}
.sym .nm{display:flex;flex-direction:column;align-items:flex-start;min-width:0;line-height:1.15}
.sym b{font-size:15px;font-weight:700;letter-spacing:.1px;white-space:nowrap}
.sym small{font-size:11px;color:var(--dim);white-space:nowrap}
.sym .srch{color:var(--faint);width:16px;height:16px}
.quote{display:flex;align-items:baseline;gap:8px;padding:0 6px;white-space:nowrap}
.quote .px{font-size:16px;font-weight:600}
.quote .ch{font-size:13px;font-weight:600}
.tfs{display:flex;gap:1px;background:#0d0e11;border:1px solid var(--line);border-radius:8px;padding:2px}
.tfs .tb{height:28px;padding:0 9px;border-radius:6px;font-size:12.5px}
.tfs .tb.on{background:#262a33;color:#fff}
.grow{flex:1}
.sync{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:12px;padding:0 8px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.dot.ok{background:var(--up)} .dot.busy{background:#f5a623} .dot.err{background:var(--down)}

/* main area */
.main{display:grid;grid-template-columns:48px 1fr 344px;min-height:0;position:relative}
.tools{background:var(--bar);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;overflow-y:auto;scrollbar-width:none}
.tools.off{pointer-events:none;opacity:.3}
.tool{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:7px;color:#a9adb6;flex:none}
.tool:hover{background:var(--hover);color:#fff}
.tool.on{color:var(--accent2);background:var(--sel)}
.tools hr{width:24px;border:0;border-top:1px solid var(--line2);margin:6px 0;flex:none}
.stage{position:relative;min-width:0;min-height:0;background:var(--bg);overflow:hidden}
#kc,#alt{position:absolute;inset:0}
#kc{z-index:1}
#alt{z-index:2}
#alt iframe{border:0;width:100%;height:100%;display:block}
.wm{position:absolute;left:0;right:70px;top:38%;text-align:center;font-size:clamp(40px,7vw,96px);font-weight:800;letter-spacing:-1px;color:rgba(255,255,255,.028);pointer-events:none;user-select:none;white-space:nowrap;overflow:hidden;z-index:0}
.banner{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--pop);border:1px solid var(--line2);color:var(--dim);
  padding:7px 8px 7px 14px;border-radius:9px;font-size:12.5px;z-index:5;display:flex;gap:12px;align-items:center;width:max-content;max-width:calc(100% - 24px);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.banner b{color:var(--text);font-weight:600}
.banner button{color:var(--accent2);font-weight:600;white-space:nowrap;display:flex}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:4}
.loading::after{content:"";width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--accent2);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fab{position:absolute;z-index:6;display:none;align-items:center;gap:6px;background:var(--pop);border:1px solid var(--line2);border-radius:20px;padding:8px 14px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.4)}
#delSel{left:50%;bottom:16px;transform:translateX(-50%);color:var(--down)}
#delSel.show{display:flex}

/* chart legend (drawn over the chart) */
.legend{position:absolute;inset:0;pointer-events:none;z-index:3}
.lg{position:absolute;left:8px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;max-width:calc(100% - 96px)}
.lg-t{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:12px;row-gap:2px;padding:2px 4px 4px;font-size:12px;color:var(--dim)}
.lg-t .nm{font-size:14px;font-weight:600;color:var(--text)}
.lg-t .tf{color:var(--dim);font-weight:500}
.lg-t em{font-style:normal;color:var(--faint);margin-right:4px}
.lg-r{display:flex;align-items:center;gap:8px;height:22px;padding:0 4px;border-radius:5px;pointer-events:auto;max-width:100%;border:1px solid transparent;font-size:12px;cursor:default;white-space:nowrap}
.lg-r:hover,.lg-r.open{background:rgba(17,19,23,.92);border-color:var(--line2)}
.lg-r .n{color:#c9ccd3;font-weight:500}
.lg-r .p{color:var(--faint)}
.lg-r .vs{display:flex;gap:9px;overflow:hidden}
.lg-r .a{display:none;gap:1px;margin-left:2px}
.lg-r:hover .a,.lg-r.open .a{display:flex}
.lg-r .a button{width:22px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:4px;color:var(--dim)}
.lg-r .a button:hover{color:#fff;background:#2a2e37}
.lg-r .a svg{width:15px;height:15px}
.lg-r.off .n,.lg-r.off .p,.lg-r.off .vs{opacity:.35}

/* watchlist */
.wp{background:var(--bar);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.wtop{display:flex;align-items:center;height:46px;padding:0 6px 0 14px;flex:none}
.wtop .t{font-weight:700;font-size:14px;flex:1}
.wtop .tb{height:30px;padding:0 7px}
.wcols,.row{display:grid;grid-template-columns:minmax(0,1fr) 96px 70px;align-items:center;column-gap:6px}
.wcols{padding:0 14px 6px;color:var(--faint);font-size:11px;font-weight:500;border-bottom:1px solid var(--line);flex:none}
.wcols span:not(:first-child),.row .n{text-align:right}
.wl{overflow-y:auto;flex:1;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#2a2e37 transparent}
.grp{display:flex;align-items:center;gap:6px;padding:14px 14px 6px;color:var(--faint);font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;cursor:pointer;user-select:none}
.grp:hover{color:var(--dim)}
.grp svg{width:13px;height:13px;transition:transform .15s}
.grp.closed svg{transform:rotate(-90deg)}
.row{padding:0 14px 0 12px;height:36px;cursor:pointer;position:relative;border-left:2px solid transparent}
.row:hover{background:var(--hover)}
.row.on{background:var(--sel);border-left-color:var(--accent)}
.row .s{display:flex;align-items:center;gap:9px;min-width:0}
.row .s b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.row .s b i{font-style:normal;font-weight:400;color:var(--faint);font-size:11.5px;margin-left:1px}
.row .n{font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.row .n.chg{display:none}
.row .x{position:absolute;right:6px;top:8px;width:20px;height:20px;border-radius:4px;display:none;align-items:center;justify-content:center;background:#2a2e37;color:var(--dim)}
.row .x:hover{color:#fff}
.row .x svg{width:14px;height:14px}
.row .pct:empty{background:none!important}
.row:hover .x{display:flex}
.row.drag{opacity:.4}
.row.over{box-shadow:inset 0 2px 0 var(--accent)}
.up{color:var(--up)!important} .down{color:var(--down)!important}
.flash-up{animation:fu .9s}.flash-down{animation:fd .9s}
@keyframes fu{0%{color:#3fe0bd}100%{color:inherit}}
@keyframes fd{0%{color:#ff6b7a}100%{color:inherit}}

/* details of the open symbol, under the watchlist */
.det{border-top:1px solid var(--line);padding:14px 14px 16px;flex:none}
.det .hd{display:flex;align-items:center;gap:10px}
.det .hd .ic{width:28px;height:28px;font-size:12px}
.det .hd b{font-size:14px;font-weight:700;display:block}
.det .hd small{font-size:11.5px;color:var(--dim)}
.det .big{display:flex;align-items:baseline;gap:10px;margin:12px 0 2px;flex-wrap:wrap}
.det .big .px{font-size:26px;font-weight:600;letter-spacing:-.4px}
.det .big .ch{font-size:13px;font-weight:600}
.det .rng{margin:14px 0 4px}
.det .rng .lb{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-bottom:6px}
.det .bar{height:4px;border-radius:2px;background:#22262d;position:relative}
.det .bar i{position:absolute;top:-3px;width:2px;height:10px;border-radius:1px;background:var(--text)}
.det .rng .vv{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:6px}
.det .kv{display:grid;grid-template-columns:1fr auto;row-gap:6px;margin-top:12px;font-size:12px}
.det .kv span:nth-child(odd){color:var(--faint)}
.det .kv span:nth-child(even){text-align:right;color:#c9ccd3}
.det .note{margin:10px 0 0}

/* coin icons */
.ic{width:20px;height:20px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;overflow:hidden;background:#2a2e37}
.ic img{width:100%;height:100%;object-fit:cover}

/* modals */
.scrim{position:fixed;inset:0;background:rgba(4,5,7,.66);backdrop-filter:blur(2px);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:72px 16px 16px}
.dlg{background:var(--pop);border:1px solid var(--line2);border-radius:12px;width:min(620px,100%);max-height:calc(100dvh - 100px);display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.55);overflow:hidden}
.dh{display:flex;align-items:center;padding:16px 12px 12px 18px;font-size:16px;font-weight:700;flex:none}
.dh .tb{height:30px;padding:0 6px}
.sbox{display:flex;align-items:center;gap:8px;margin:0 16px 12px;padding:0 12px;height:42px;border:1px solid var(--line2);background:#0f1114;border-radius:8px;color:var(--dim);flex:none}
.sbox:focus-within{border-color:var(--accent)}
.sbox input{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:15px;min-width:0}
.chips{display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto;flex:none}
.chip{padding:6px 12px;border-radius:15px;background:#22262d;color:var(--dim);font-size:12px;font-weight:600;white-space:nowrap}
.chip:hover{color:var(--text)}
.chip.on{background:var(--text);color:#111}
.list{overflow-y:auto;border-top:1px solid var(--line);flex:1;overscroll-behavior:contain}
.sr{display:grid;grid-template-columns:28px minmax(0,1fr) auto 32px;align-items:center;gap:12px;padding:9px 10px 9px 18px;cursor:pointer;border-bottom:1px solid var(--line)}
.sr:hover,.sr.sel{background:#1f232a}
.sr .ic{width:26px;height:26px;font-size:10px}
.sr b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr .d{color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr .r{text-align:right;font-size:12px;color:var(--dim);white-space:nowrap}
.sr .r .p{color:var(--text);font-size:13px;font-variant-numeric:tabular-nums}
.sr .add{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.sr .add:hover{background:#2a2e37;color:var(--text)}
.sr .add.in{color:var(--accent2)}
.empty{padding:24px 16px;color:var(--dim);text-align:center}
.sec{padding:14px 18px 6px;color:var(--faint);font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase}
.ir{display:flex;align-items:center;gap:12px;padding:10px 18px;cursor:pointer;border-bottom:1px solid var(--line)}
.ir:hover{background:#1f232a}
.ir b{font-weight:600;min-width:76px}
.ir .d{color:var(--dim);font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act{display:flex;align-items:center;gap:8px;padding:9px 12px 9px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.act.hl{background:#1a2234}
.act b{min-width:76px}
.act input[type=text]{width:120px;background:#0f1114;border:1px solid var(--line2);border-radius:6px;color:var(--text);padding:6px 8px;font:inherit}
.act input[type=color]{width:24px;height:24px;border:1px solid var(--line2);border-radius:5px;padding:0;background:none;cursor:pointer}
.act .grow{flex:1}
.act .tb{height:28px;padding:0 6px}
.act.hid b,.act.hid input{opacity:.45}
.form{padding:4px 18px 20px;overflow-y:auto}
.form h4{margin:18px 0 9px;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.frow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.frow label{display:flex;align-items:center;gap:8px}
.frow input[type=color]{width:34px;height:28px;border:1px solid var(--line2);border-radius:6px;padding:0;background:none;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{padding:7px 13px;color:var(--dim)}
.seg button.on{background:#2a2e37;color:var(--text)}
.btn{padding:8px 14px;border-radius:7px;background:#22262d;font-weight:600}
.btn:hover{background:#2a2e37}
.btn.pri{background:var(--accent);color:#fff}
.btn.pri:hover{background:#1e53e5}
.note{color:var(--dim);font-size:12px;line-height:1.5;margin:0 0 10px}
.qr{background:#fff;padding:8px;border-radius:6px;display:inline-block;line-height:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--pop);border:1px solid var(--line2);padding:9px 14px;border-radius:9px;z-index:90;max-width:calc(100% - 32px);font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.menu{position:fixed;z-index:60;background:var(--pop);border:1px solid var(--line2);border-radius:9px;padding:4px;box-shadow:0 12px 32px rgba(0,0,0,.5);min-width:150px}
.menu button{display:block;width:100%;text-align:left;padding:9px 16px;border-radius:6px;color:#c9ccd3}
.menu button:hover{background:#22262d;color:#fff}
.menu button.on{color:var(--accent2)}
.tabs{display:none}

/* phone */
@media (max-width:820px){
  .app{grid-template-rows:54px 1fr calc(56px + env(safe-area-inset-bottom))}
  .top{padding:0 4px 0 6px;gap:0}
  .tfs,.hide-m,.sync span,.wcols,.det{display:none!important}
  .sym{padding:0 6px 0 2px;gap:8px}
  .sym .ic{width:24px;height:24px}
  .sym small,.sym .srch{display:none}
  .quote{flex-direction:column;align-items:flex-start;gap:0;line-height:1.2;padding:0 4px;min-width:0}
  .quote .px{font-size:14px}
  .quote .ch{font-size:11.5px}
  .tb{padding:0 8px}
  .main{grid-template-columns:1fr}
  .tools{position:absolute;left:0;right:0;bottom:0;z-index:7;flex-direction:row;height:54px;padding:0 6px;border-right:0;border-top:1px solid var(--line);overflow-x:auto;overflow-y:hidden;display:none}
  .tools.open{display:flex}
  .tools hr{width:0;height:26px;border:0;border-left:1px solid var(--line2);margin:0 4px}
  .tool{width:42px;height:42px}
  #penBtn.on{color:var(--accent2);background:var(--sel)}
  #delSel{bottom:68px}
  .main.tools-open #delSel{bottom:68px}
  .banner{bottom:12px;left:10px;right:10px;transform:none;width:auto}
  .lg{max-width:calc(100% - 70px)}
  .lg-t{font-size:11px;column-gap:8px}
  .lg-t .nm{font-size:13px}
  .lg-t .ohl{display:none}
  .lg-r{font-size:11px;height:20px}
  .wm{right:56px;font-size:44px}
  .wp{position:absolute;inset:0;z-index:20;border-left:0}
  .app:not(.show-w) .wp{display:none}
  .wtop{height:50px}
  .wtop .t{font-size:18px}
  .row{grid-template-columns:minmax(0,1fr) auto 78px;column-gap:12px;height:60px;padding:0 16px;border-left:0;border-bottom:1px solid #16181d}
  .row.on{background:none}
  .row .s{gap:12px}
  .row .s b{font-size:15px}
  .row .s .ic{width:32px;height:32px;font-size:12px}
  .row .ex{display:block;color:var(--faint);font-size:12px;font-weight:400;margin-top:1px}
  .row .n{font-size:15px}
  .row .n.chg{display:none}
  .row .pct{justify-self:end;padding:7px 0;width:78px;border-radius:6px;text-align:center!important;color:#fff!important;font-weight:600;font-size:13px;background:#22262d}
  .row .pct.up{background:var(--up)} .row .pct.down{background:var(--down)}
  .row:hover{background:none}
  .row .x{display:none!important}
  .wp.edit .row{grid-template-columns:minmax(0,1fr) 40px}
  .wp.edit .row .n{display:none}
  .wp.edit .row .x{display:flex!important;position:static;width:32px;height:32px;justify-self:end;color:var(--down)}
  .tabs{display:flex;background:var(--bar);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;color:var(--faint)}
  .tabs button.on{color:var(--text)}
  .tabs button.on svg{color:var(--accent2)}
  .scrim{padding:0;align-items:stretch}
  .dlg{width:100%;max-height:none;height:100%;border-radius:0;border:0}
  .sbox input{font-size:16px}
}
@media (min-width:821px){ .row .ex{display:none} .m-only{display:none!important} }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="sym" id="symBtn" title="Search symbols"><span class="ic" id="symIc"></span><span class="nm"><b id="symName"></b><small id="symEx"></small></span><svg class="i srch" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    <div class="quote num"><span class="px" id="symPx"></span><span class="ch" id="symChg"></span></div>
    <div class="sep hide-m"></div>
    <div class="tfs" id="tfs"></div>
    <div class="grow m-only"></div>
    <button class="tb m-only" id="tfBtn"></button>
    <div class="sep hide-m"></div>
    <button class="tb" id="indBtn" title="Indicators"><svg class="i" viewBox="0 0 24 24"><path d="M3 20l5-7 4 3 7-10"/><path d="M15 6h4v4"/></svg><span class="hide-m">Indicators</span></button>
    <button class="tb hide-m" id="typeBtn" title="Chart type"><svg class="i" viewBox="0 0 24 24"><path d="M7 3v4M7 17v4M17 5v3M17 16v4"/><rect x="5" y="7" width="4" height="10" rx="1"/><rect x="15" y="8" width="4" height="8" rx="1"/></svg></button>
    <button class="tb hide-m" id="viewBtn" title="Switch between your chart (drawings save) and the TradingView chart"></button>

// ---------- data sources ----------
const exOf = it => it.k === 'tv' ? it.s.split(':')[0] : null;
// Crypto pairs from other exchanges (e.g. BITSTAMP:BTCUSD) use Binance's USDT market for data.
function binSym(it){
  if (it.k !== 'tv') return null;
  const [ex, sym] = it.s.split(':');
  if (ex === 'BINANCE') return /^[A-Z0-9]{2,20}$/.test(sym) ? sym : null;
  const m = /^(BITSTAMP|COINBASE|KRAKEN|BYBIT|OKX|BITFINEX|GEMINI)$/.test(ex) && sym.match(/^([A-Z0-9]{2,10})USDT?$/);
  return m ? m[1] + 'USDT' : null;
}
function srcOf(it){
  if (it.k === 'dex') return 'gecko';
  return binSym(it) ? 'binance' : 'tv';
}
const GK_NET = {ethereum:'eth', polygon:'polygon_pos', avalanche:'avax', sui:'sui-network', cronos:'cro', fantom:'ftm'};
function bucket(ts, agg){ const d = new Date(ts);
  if (agg === 'm') return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1);
  const day = (d.getUTCDay() + 6) % 7; return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - day * 864e5; }
function aggregate(rows, agg){ if (!agg) return rows; const out = [];
  for (const r of rows){ const b = bucket(r.timestamp, agg); const last = out[out.length - 1];
    if (last && last.timestamp === b){ last.high = Math.max(last.high, r.high); last.low = Math.min(last.low, r.low); last.close = r.close; last.volume += r.volume || 0; }
    else out.push({timestamp:b, open:r.open, high:r.high, low:r.low, close:r.close, volume:r.volume || 0}); }
  return out; }
async function getJSON(url){ const r = await fetch(url); if (!r.ok) throw new Error(r.status + ' ' + url); return r.json(); }
const gkRows = list => list.map(r => ({timestamp:r[0] * 1000, open:+r[1], high:+r[2], low:+r[3], close:+r[4], volume:+r[5]})).sort((a, b) => a.timestamp - b.timestamp);
const gkUrl = (it, f, limit, before) => `https://api.geckoterminal.com/api/v2/networks/${encodeURIComponent(GK_NET[it.c] || it.c)}/pools/${encodeURIComponent(it.p)}/ohlcv/${f.gk[0]}?aggregate=${f.gk[1]}&limit=${limit}&currency=usd${before ? '&before_timestamp=' + Math.floor(before / 1000) : ''}`;

// Each source returns {rows (oldest first), more}
const SRC = {
  async binance(it, tf, before){
    const j = await getJSON(`https://data-api.binance.vision/api/v3/klines?symbol=${binSym(it)}&interval=${TFI[tf].bn}&limit=1000${before ? '&endTime=' + (before - 1) : ''}`);
    return {rows: j.map(r => ({timestamp:r[0], open:+r[1], high:+r[2], low:+r[3], close:+r[4], volume:+r[5]})), more: j.length === 1000};
  },
  async gecko(it, tf, before){
    const f = TFI[tf];
    const j = await getJSON(gkUrl(it, f, 1000, before));
    const list = (j.data && j.data.attributes && j.data.attributes.ohlcv_list) || [];
    let rows = aggregate(gkRows(list), f.agg);
    const more = list.length >= 999;
    if (f.agg && more) rows.shift();
    return {rows, more};
  },
};
let live = null;
function stopLive(){ if (!live) return; live.stop = true; if (live.ws) { live.ws.onclose = null; try { live.ws.close(); } catch {} } clearInterval(live.timer); live = null; }
function startLive(it, tf, cb){
  stopLive(); const L = live = {stop:false};
  const src = srcOf(it), f = TFI[tf];
  if (src === 'binance'){
    const open = () => {
      if (L.stop) return;
      const ws = L.ws = new WebSocket(`wss://data-stream.binance.vision/ws/${binSym(it).toLowerCase()}@kline_${f.bn}`);
      ws.onmessage = e => { const k = JSON.parse(e.data).k; if (k && !L.stop) cb({timestamp:k.t, open:+k.o, high:+k.h, low:+k.l, close:+k.c, volume:+k.v}); };
      ws.onclose = () => { if (!L.stop) setTimeout(open, 3000); };
    };
    open();
    return;
  }
  const limit = f.agg === 'm' ? 32 : f.agg ? 8 : 2;
  const poll = async () => {
    if (L.stop || document.hidden) return;
    try {
      let rows = gkRows((await getJSON(gkUrl(it, f, limit))).data.attributes.ohlcv_list);
      rows = aggregate(rows, f.agg);
      const last = rows[rows.length - 1]; if (!last || L.stop) return;
      if (f.agg){ const have = chart.getDataList(), cur = have[have.length - 1];
        // the polled window may not cover the whole week/month; keep the open/high/low already known
        if (cur && cur.timestamp === last.timestamp){ last.open = cur.open; last.high = Math.max(cur.high, last.high); last.low = Math.min(cur.low, last.low); last.volume = Math.max(cur.volume || 0, last.volume); } }
      cb(last);
    } catch {}
  };
  L.timer = setInterval(poll, 30000);
}

const loader = {
  getBars: async ({type, timestamp, callback, symbol}) => {
    const seq = symbol._seq, it = curItem(), tf = M().tf;
    if (seq !== loadSeq || mode !== 'kc') return;
    try {
      const {rows, more} = await SRC[srcOf(it)](it, tf, type === 'forward' ? timestamp : null);
      if (seq !== loadSeq) return;
      if (type === 'init') {
        if (!rows.length) throw new Error('no data');
        const dec = decimalsFor(rows[rows.length - 1].close);
        if (dec !== symbol.pricePrecision) { chart.setSymbol({pricePrecision: dec}); return; }   // reloads with the right precision
        $('#loading').hidden = true; $('#kc').style.visibility = ''; $('#legend').style.visibility = '';
      }
      callback(rows, {forward: more, backward: false});
      scheduleLegend(); setTimeout(() => { positionLegend(); scheduleLegend(); }, 120);
    } catch (e) {
      if (seq !== loadSeq) return;
      $('#loading').hidden = true;
      if (type !== 'init') return callback([], false);
      if (it.k === 'dex') showAlt(it, 'No price history for this pool on GeckoTerminal, so it opens in the DexScreener chart. Drawings there are not synced.');

let dragId = null;
function nameParts(it){

function select(it){ S.cur = it; persist(); if (isPhone()) setTab('c'); openChart(); }
function renderWatch(){
  const box = $('#wl'), top = box.scrollTop; box.textContent = '';
  const cur = idOf(curItem());
  const groups = [];
  for (const it of M().watch) { const g = it.g || 'Added'; let G = groups.find(x => x.g === g); if (!G) groups.push(G = {g, items:[]}); G.items.push(it); }

      );

function updatePriceCells(id, prev){

    cell.textContent = fmtNum(q.p);
    if (prev != null && q.p !== prev) { cell.classList.remove('flash-up','flash-down'); void cell.offsetWidth; cell.classList.add(q.p > prev ? 'flash-up' : 'flash-down'); }
    const row = cell.parentElement, dir = isFinite(q.c) ? (q.c >= 0 ? 'up' : 'down') : '';

let tickWs = null, tickKey = '';
let binIds = {};
function binanceSyms(){ binIds = {}; for (const it of [...M().watch, curItem()]) { const b = binSym(it); if (b) (binIds[b] ||= new Set()).add(idOf(it)); } return Object.keys(binIds); }
function setBin(sym, c, o, hi, lo, vol){ for (const id of (binIds[sym] || [])) { if (hi) info[id] = {hi, lo, vol}; setPrice(id, c, o ? (c - o) / o * 100 : 0, c - o); } }
function connectTicker(){
  const syms = binanceSyms(), key = syms.join(',');
  if (key === tickKey && tickWs) return;
  tickKey = key; if (tickWs) { tickWs.onclose = null; tickWs.close(); tickWs = null; }
  if (!syms.length) return;
  const ws = tickWs = new WebSocket('wss://data-stream.binance.vision/stream?streams=' + syms.map(s => s.toLowerCase() + '@miniTicker').join('/'));
  ws.onmessage = e => { const d = JSON.parse(e.data).data; if (d) setBin(d.s, +d.c, +d.o, +d.h, +d.l, +d.q); };
  ws.onclose = () => { if (tickWs === ws) { tickWs = null; setTimeout(connectTicker, 4000); } };
}
async function refreshPrices(){
  const list = [...M().watch]; if (!list.some(w => idOf(w) === idOf(curItem()))) list.push(curItem());
  const jobs = [];
  const bn = binanceSyms();
  const bnRow = r => setBin(r.symbol, +r.lastPrice, +r.openPrice, +r.highPrice, +r.lowPrice, +r.quoteVolume);
  if (bn.length) jobs.push(getJSON('https://data-api.binance.vision/api/v3/ticker/24hr?type=MINI&symbols=' + encodeURIComponent(JSON.stringify(bn)))
    .then(rows => rows.forEach(bnRow))
    .catch(() => Promise.all(bn.map(s => getJSON('https://data-api.binance.vision/api/v3/ticker/24hr?type=MINI&symbol=' + s).then(bnRow).catch(() => {})))));
  const byChain = {};
  for (const it of list) if (it.k === 'dex') (byChain[it.c] ||= []).push(it);
  for (const [c, its] of Object.entries(byChain)) for (let i = 0; i < its.length; i += 30) {
    const chunk = its.slice(i, i + 30);
    jobs.push(getJSON(`https://api.dexscreener.com/latest/dex/pairs/${encodeURIComponent(c)}/${chunk.map(x => encodeURIComponent(x.p)).join(',')}`).then(j => {
      for (const p of (j.pairs || [])) { const it = chunk.find(x => x.p.toLowerCase() === String(p.pairAddress).toLowerCase());
        if (it) { const pc = p.priceChange ? +p.priceChange.h24 : NaN, px = +p.priceUsd;
          info[idOf(it)] = {vol: p.volume && +p.volume.h24, liq: p.liquidity && +p.liquidity.usd, fdv: +p.fdv || +p.marketCap};
          setPrice(idOf(it), px, pc, isFinite(pc) ? px - px / (1 + pc / 100) : NaN); } }
    }).catch(() => {}));
  }
  await Promise.all(jobs);
  connectTicker();
}

let binAll = null, chip = 'all', srSel = 0, srRows = [], sSeq = 0;
const CHIPS = [['all','All'],['binance','Binance'],['dex','DEX tokens'],['tv','TradingView']];
const CHAIN_NAMES = {ethereum:'Ethereum',bsc:'BNB Chain',solana:'Solana',base:'Base',arbitrum:'Arbitrum',polygon:'Polygon',avalanche:'Avalanche',optimism:'Optimism',sui:'Sui',ton:'TON',tron:'Tron',hyperliquid:'Hyperliquid',hyperevm:'HyperEVM',unichain:'Unichain',abstract:'Abstract',sonic:'Sonic',blast:'Blast',linea:'Linea',zksync:'zkSync',mantle:'Mantle',pulsechain:'PulseChain',cronos:'Cronos',berachain:'Berachain'};

}

const inWatch = it => M().watch.some(w => idOf(w) === idOf(it));

async function runSearch(text){
  const seq = ++sSeq; text = text.trim();
  const out = [], T = text.toUpperCase();
  const link = text.match(/dexscreener\.com\/([a-z0-9-]+)\/([A-Za-z0-9]+)/i);
  if (!text) {
    for (const it of M().watch) out.push({item:it, title:it.n, desc:it.x || it.chainName || '', right: prices[idOf(it)] ? fmtNum(prices[idOf(it)].p) : '', chg: prices[idOf(it)] ? prices[idOf(it)].c : NaN});
    return paint(out, seq, 'Your watchlist');
  }
  if ((chip === 'all' || chip === 'binance') && !link && binAll) {
    const quotes = ['USDT','USDC','FDUSD','BTC'], want = T.replace(/(USDT|USDC|USD)$/, '') || T, m = [];
    for (const r of binAll) { const s = r.symbol, qq = quotes.find(x => s.endsWith(x)); if (!qq) continue; const base = s.slice(0, -qq.length);
      if (base.startsWith(want) || s === T) m.push({s, base, qq, p:+r.price, score:(base === want ? 0 : 1) + quotes.indexOf(qq) * 0.1 + base.length * 0.01}); }
    m.sort((a, b) => a.score - b.score);
    for (const x of m.slice(0, chip === 'binance' ? 60 : 6))
      out.push({item:{k:'tv', s:'BINANCE:' + x.s, n:x.s, x:'Binance'}, title:x.s, desc:x.base + ' / ' + x.qq + ' · Binance spot', right:fmtNum(x.p), price:x.p});
  }
  if ((chip === 'all' || chip === 'tv') && !link && /^[A-Z0-9!._-]{1,20}:[A-Z0-9!._-]{1,30}$/.test(T)) {
    const [ex, sym] = T.split(':');
    out.push({item:{k:'tv', s:T, n:sym, x:ex[0] + ex.slice(1).toLowerCase()}, title:sym, desc:'TradingView · ' + T, right:'TradingView'});
  } else if (chip === 'tv') out.push({item:{k:'tv', s:'CAPITALCOM:DXY', n:'DXY', x:'Capitalcom'}, title:'Type EXCHANGE:SYMBOL', desc:'for markets outside Binance, e.g. CAPITALCOM:DXY, OANDA:XAUUSD, CRYPTOCAP:TOTAL2', right:''});
  paint(out, seq);
  if (chip !== 'all' && chip !== 'dex') return;
  try {
    const j = await getJSON('https://api.dexscreener.com/latest/dex/search?q=' + encodeURIComponent(link ? link[2] : text));
    if (seq !== sSeq) return;
    const vol = x => (x.volume && x.volume.h24) || 0, liq = x => (x.liquidity && x.liquidity.usd) || 0;
    const pairs = (j.pairs || []).sort((a, b) => (vol(b) - vol(a)) || (liq(b) - liq(a))).slice(0, chip === 'dex' ? 40 : 15);
    for (const p of pairs) {
      const n = (p.baseToken && p.baseToken.symbol || '?') + '/' + (p.quoteToken && p.quoteToken.symbol || '?');
      const img = p.info && typeof p.info.imageUrl === 'string' ? p.info.imageUrl : undefined;
      const it = {k:'dex', c:p.chainId, p:p.pairAddress, n, chainName:chainName(p.chainId), dex:p.dexId, img};
      out.push({item:it, title:n, price:+p.priceUsd, chg: p.priceChange ? +p.priceChange.h24 : NaN,
        desc:[p.baseToken && p.baseToken.name, chainName(p.chainId), p.dexId, shortAddr(p.baseToken && p.baseToken.address)].filter(Boolean).join(' · '),
        right: fmtNum(+p.priceUsd), sub: 'vol ' + (fmtUsd(vol(p)) || '0') + ' · liq ' + (fmtUsd(liq(p)) || '?')});
    }
  } catch {}
  paint(out, seq, null, true);
}
function paint(rows, seq, title, done){
  if (seq !== sSeq) return;
  srRows = rows; srSel = Math.min(srSel, Math.max(0, rows.length - 1));
  const box = $('#results'); box.textContent = '';
  if (title) box.append(h('div', {class:'sec', text:title}));
  if (!rows.length) { box.append(h('div', {class:'empty', text: done ? 'No matches' : 'Searching…'})); return; }
  rows.forEach((r, i) => {
    const add = h('button', {class:'add' + (inWatch(r.item) ? ' in' : ''), title:'Add to / remove from watchlist', svg:svg(inWatch(r.item) ? ICON.check : ICON.plus),
      onclick:e => { e.stopPropagation(); toggleWatch(r.item); add.classList.toggle('in', inWatch(r.item)); add.innerHTML = svg(inWatch(r.item) ? ICON.check : ICON.plus); }});
    box.append(h('div', {class:'sr' + (i === srSel ? ' sel' : ''), onclick:() => pickResult(r)},
      iconEl(r.item),
      h('div', {style:'min-width:0'}, h('b', {text:r.title}), h('div', {class:'d', text:r.desc || ''})),
      h('div', {class:'r'}, h('div', {class:'p', text:r.right || ''}), r.sub ? h('div', {text:r.sub}) : (isFinite(r.chg) ? h('div', {class: r.chg >= 0 ? 'up' : 'down', text:fmtPct(r.chg)}) : null)),
      add));
  });
}

// ---------- indicators dialog ----------
$('#indBtn').onclick = () => openInd();
let indFocus = null;
function openInd(focus){ indFocus = typeof focus === 'string' ? focus : null; $('#indDlg').hidden = false; $('#iq').value = ''; renderInd();
  const hl = $('#indList .act.hl'); if (hl) { hl.scrollIntoView({block:'nearest'}); const inp = hl.querySelector('input'); if (inp && !isPhone()) inp.focus(); } else if (!isPhone()) $('#iq').focus(); }
$('#iq').addEventListener('input', renderInd);
function applyInd(){ touchMeta(); if (mode === 'kc') buildIndicators(); else openChart(); }
function renderInd(){
  const box = $('#indList'); box.textContent = '';
  const q = $('#iq').value.trim().toLowerCase();
  if (!q && M().ind.length) {
    box.append(h('div', {class:'sec', text:'On your chart'}));
    for (const x of M().ind) {
      const lib = LIB[x.n];
      const row = h('div', {class:'act' + (x.hide ? ' hid' : '') + (x.id === indFocus ? ' hl' : '')}, h('b', {text:SHORT[x.n] || x.n}));
      if (lib.p.length) {
        const inp = h('input', {type:'text', value:x.p.join(', '), title:'Lengths / settings, comma separated', inputmode:'decimal'});
        inp.onchange = () => { const v = inp.value.split(/[,\s]+/).map(Number).filter(n => isFinite(n) && n > 0); if (v.length) { x.p = v; applyInd(); renderInd(); } };
        row.append(inp);
        if (['MA','EMA','SMA','RSI','BOLL','MACD','STOCHRSI','KDJ'].includes(x.n)) (x.n === 'BOLL' || x.n === 'KDJ' ? [0,1,2] : x.n === 'MACD' || x.n === 'STOCHRSI' ? [0,1] : x.p).forEach((_, i) => {
          const c = h('input', {type:'color', value:x.c[i] || PALETTE[i % PALETTE.length], title:'Color of line ' + (i + 1)});
          c.onchange = () => { x.c[i] = c.value; applyInd(); }; row.append(c); });
      }
      row.append(h('span', {class:'grow'}),
        h('button', {class:'tb', title: x.hide ? 'Show' : 'Hide', svg:svg(x.hide ? ICON.eyeOff : ICON.eye), onclick:() => { x.hide = !x.hide; applyInd(); renderInd(); }}),
        h('button', {class:'tb', title:'Remove', svg:svg(ICON.trash), onclick:() => { M().ind = M().ind.filter(y => y !== x); applyInd(); renderInd(); }}));
      box.append(row);
    }
  }
  box.append(h('div', {class:'sec', text: q ? 'Results' : 'Add indicator'}));
  for (const [name, desc] of IND_LIB) {
    if (q && !(name.toLowerCase().includes(q) || desc.toLowerCase().includes(q))) continue;
    box.append(h('div', {class:'ir', onclick:() => {
      const lib = LIB[name];
      M().ind.push({id:uid(), n:name, p:[...lib.p], c:lib.p.map((_, i) => PALETTE[(i + M().ind.length) % PALETTE.length])});
      applyInd(); $('#iq').value = ''; renderInd(); toast(desc + ' added', 1400);
    }}, h('b', {text:name}), h('span', {class:'d', text:desc}), h('span', {svg:svg(ICON.plus), style:'color:var(--dim);display:flex'})));
  }
}

// ---------- settings ----------
const CTYPES = [['candle_solid','Candles'],['candle_up_stroke','Hollow candles'],['ohlc','Bars'],['area','Line']];
$('#setBtn').onclick = openSettings;
function openSettings(){
  $('#setDlg').hidden = false;
  const f = $('#setForm'); f.textContent = '';
  const m = M();
  const up = h('input', {type:'color', value:m.up}), dn = h('input', {type:'color', value:m.down});
  const applyColors = () => { m.up = up.value; m.down = dn.value; touchMeta(); chart.setStyles(chartStyles()); if (mode !== 'kc') openChart(); };
  up.oninput = dn.oninput = applyColors;
  f.append(h('h4', {text:'Candle colors'}),
    h('div', {class:'frow'}, h('label', null, 'Up', up), h('label', null, 'Down', dn),
      h('button', {class:'btn', text:'White / blue', onclick:() => { up.value = '#f2f2ee'; dn.value = '#3b78b8'; applyColors(); }}),
      h('button', {class:'btn', text:'Green / red', onclick:() => { up.value = '#089981'; dn.value = '#f23645'; applyColors(); }})));
  const seg = h('div', {class:'seg'});
  for (const [v, l] of CTYPES)
    seg.append(h('button', {class: m.ctype === v ? 'on' : '', text:l, onclick:() => { m.ctype = v; touchMeta(); chart.setStyles(chartStyles()); openSettings(); }}));
  f.append(h('h4', {text:'Chart type'}), seg);
  f.append(h('h4', {text:'Sync between PC and phone'}));
  if (!SYNC_URL) { f.append(h('p', {class:'note', text:'Sync is not set up yet. Everything is saved in this browser.'})); return; }
  const url = location.origin + location.pathname + '#k=' + S.key;
  f.append(h('p', {class:'note', text:'Your watchlist, indicators and drawings sync on their own. To get them on another device, scan this code with it or open the link there. Anyone with the link can see and change your charts, so keep it to yourself.'}));
  const row = h('div', {class:'frow', style:'align-items:flex-start'});
  if (window.qrcode) { const qr = qrcode(0, 'M'); qr.addData(url); qr.make(); const d = h('div', {class:'qr'}); d.innerHTML = qr.createSvgTag({cellSize:4, margin:0}); row.append(d); }
  row.append(h('div', {style:'display:flex;flex-direction:column;gap:8px'},
    h('button', {class:'btn pri', text:'Copy sync link', onclick:async () => { try { await navigator.clipboard.writeText(url); toast('Link copied. Open it on your other device.'); } catch { prompt('Copy this link', url); } }}),
    h('button', {class:'btn', text:'Sync now', onclick:() => pull(true)}),
    h('span', {class:'note', id:'syncInfo', text:syncInfo()})));
  f.append(row);
}

// ---------- sync ----------
let pushT = null, syncState = 'idle', lastSync = 0;
function syncInfo(){ return syncState === 'err' ? 'Last sync failed, retrying' : lastSync ? 'Synced at ' + new Date(lastSync).toLocaleTimeString() : 'Not synced yet'; }
function setSync(st){ syncState = st; $('#syncDot').className = 'dot' + (st === 'ok' ? ' ok' : st === 'busy' ? ' busy' : st === 'err' ? ' err' : '');
  $('#syncTxt').textContent = !SYNC_URL ? 'Saved on this device' : st === 'err' ? 'Sync error' : st === 'busy' ? 'Syncing…' : 'Synced';
  $('#sync').title = SYNC_URL ? syncInfo() : 'Everything is saved in this browser';
  const i = $('#syncInfo'); if (i) i.textContent = syncInfo(); }
function schedulePush(){ if (!SYNC_URL) return; setSync('busy'); clearTimeout(pushT); pushT = setTimeout(push, 1500); }
async function push(){
  try {
    const r = await fetch(SYNC_URL + '/v1/' + S.key, {method:'PUT', headers:{'content-type':'application/json'}, body: JSON.stringify({meta:S.meta, draws:S.draws})});
    if (!r.ok) throw 0; lastSync = Date.now(); setSync('ok');
  } catch { setSync('err'); clearTimeout(pushT); pushT = setTimeout(push, 15000); }
}
function merge(remote){
  let changed = false, needPush = false;
  const rt = remote.meta && remote.meta.t || 0, lt = S.meta.t || 0;
  if (rt > lt) { S.meta = cleanMeta(remote.meta); changed = true; } else if (lt > rt) needPush = true;
  const rd = remote.draws && typeof remote.draws === 'object' ? remote.draws : {};
  for (const [id, d] of Object.entries(rd)) { if (!d || !Array.isArray(d.o)) continue; const l = S.draws[id];
    if (!l || (d.t || 0) > (l.t || 0)) { S.draws[id] = d; changed = true; } else if ((l.t || 0) > (d.t || 0)) needPush = true; }
  for (const id of Object.keys(S.draws)) if (!rd[id]) needPush = true;
  return {changed, needPush};
}
async function pull(manual){
  if (!SYNC_URL) return;
  if (pushT && syncState === 'busy') return;   // a local change is about to upload
  setSync('busy');
  try {
    const r = await fetch(SYNC_URL + '/v1/' + S.key, {cache:'no-store'}); if (!r.ok) throw 0;
    const remote = await r.json();
    const before = JSON.stringify([S.meta, S.draws[idOf(curItem())]]);
    const {changed, needPush} = merge(remote || {});
    persist(); lastSync = Date.now(); setSync('ok');
    if (changed && JSON.stringify([S.meta, S.draws[idOf(curItem())]]) !== before) { chart.setStyles(chartStyles()); buildIndicators(); openChart(); refreshPrices(); }
    if (needPush) schedulePush();
    if (manual) toast('Synced', 1200);
  } catch { setSync('err'); }
}

// ---------- phone tabs ----------
let tabNow = 'c';
function setTab(t){
  tabNow = t;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  $('#app').classList.toggle('show-w', t === 'w');
  if (t === 's') openSearch('');
  if (t === 'i') openInd();
  if (t === 'c' || t === 'w') { $('#searchDlg').hidden = $('#indDlg').hidden = true; }
  if (t === 'c') requestAnimationFrame(() => chart.resize());
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
$('#penBtn').onclick = () => { const o = $('#tools').classList.toggle('open'); $('#penBtn').classList.toggle('on', o); if (!o) setTool('cursor'); };
$('#editBtn').onclick = () => { const on = $('#wp').classList.toggle('edit'); $('#editBtn').textContent = on ? 'Done' : 'Edit'; };

// ---------- start ----------
S = loadState();
const km = location.hash.match(/[#&]k=([\w-]{20,})/);
if (km) {   // opened from a sync link: adopt that key and take the synced copy
  if (km[1] !== S.key) { S.key = km[1]; S.meta.t = 0; for (const d of Object.values(S.draws)) d.t = 0; }
  history.replaceState(null, '', location.pathname);
}
persist();
chart.setStyles(chartStyles());
buildTools(); buildIndicators(); setSync('idle');
openChart();
refreshPrices();
setInterval(() => { if (!document.hidden) refreshPrices(); }, 30000);
if (SYNC_URL) { pull(); setInterval(() => { if (!document.hidden) pull(); }, 60000); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) { refreshPrices(); pull(); } });
new ResizeObserver(() => { chart.resize(); positionLegend(); paintQuote(); }).observe($('#stage'));
if (document.fonts) document.fonts.ready.then(() => chart.setStyles(chartStyles()));
})();
</script>
