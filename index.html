<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Charts</title>
<meta name="theme-color" content="#08090c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e0f11'/%3E%3Cpath d='M6 22l6-7 5 4 9-11' stroke='%232962ff' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --gutter:#16191f; --pane:#08090c; --raised:#0f1115; --hover:#14171d; --active:#0f1d3a; --selected:#142e61; --tip:#1c2027;
  --line:rgba(255,255,255,.06); --line2:rgba(255,255,255,.12);
  --t1:#e6e9ee; --t2:#a3aab5; --t3:#7a818c;
  --accent:#2962ff; --accent2:#5b8cff; --up:#27ad75; --down:#f0616d; --up-bg:#0a332c; --down-bg:#311013; --draw:#e6b259;
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--gutter);color:var(--t1);font:13px/1.35 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none;font-feature-settings:"cv11" 1,"ss01" 1}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;touch-action:manipulation}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"zero" 1,"cv11" 1,"ss01" 1}
.grow{flex:1}
.up{color:var(--up)!important} .down{color:var(--down)!important}

/* frame: flat panels on a 4px gutter, no borders */
.app{display:grid;height:100dvh;gap:4px;background:var(--gutter);
  grid-template-columns:44px minmax(0,1fr) 320px;grid-template-rows:40px minmax(0,1fr) 32px;
  grid-template-areas:"top top top" "tools stage wp" "tools bot wp"}
.top{grid-area:top}.tools{grid-area:tools}.stage{grid-area:stage}.bot{grid-area:bot}.wp{grid-area:wp}
.top,.tools,.stage,.bot,.wp,.tfrow,.tabs{background:var(--pane)}
.tfrow,.tabs{display:none}

/* top bar */
.top{display:flex;align-items:center;gap:2px;padding:0 6px;min-width:0}
.tb{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:6px;color:var(--t2);white-space:nowrap;font-weight:500}
.tb:hover{background:var(--hover);color:var(--t1)}
.tb.on{color:var(--accent2);background:var(--active)}
.sep{width:1px;height:20px;background:var(--line2);margin:0 6px;flex:none}
.sym{display:flex;align-items:center;gap:8px;height:28px;padding:0 10px 0 5px;border-radius:6px;background:var(--hover);min-width:0;flex:none}
.sym:hover{background:#1b1f26}
.sym .ic{width:20px;height:20px;font-size:10px}
.sym b{font-size:14px;font-weight:600;white-space:nowrap}
.sym .srch{color:var(--t3);width:15px;height:15px}
.quote{display:flex;align-items:baseline;gap:7px;padding:0 10px;white-space:nowrap}
.quote .px{font-size:16px;font-weight:600}
.quote .ch{font-size:13px;font-weight:500}
.quote .lb{font-size:11px;color:var(--t3)}
.tfs{display:flex;gap:2px}
.tfs .tb{height:28px;min-width:30px;justify-content:center;padding:0 7px;font-size:13px}
.sync{display:flex;align-items:center;gap:7px;color:var(--t3);font-size:12px;padding:0 8px;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--t3)}
.dot.ok{background:var(--up)} .dot.busy{background:#e6b259} .dot.err{background:var(--down)}

/* drawing rail */
.tools{display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;overflow-y:auto;scrollbar-width:none}
.tools.off{pointer-events:none;opacity:.3}
.tool{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--t2);flex:none}
.tool svg.i{width:20px;height:20px}
.tool:hover{background:var(--hover);color:var(--t1)}
.tool.on{color:var(--accent2);background:var(--active)}
.tools hr{width:20px;border:0;border-top:1px solid var(--line2);margin:5px 0;flex:none}

/* chart */
.stage{position:relative;min-width:0;min-height:0;overflow:hidden}
#kc,#alt{position:absolute;inset:0}
#kc{z-index:1}
#alt{z-index:2}
#alt iframe{border:0;width:100%;height:100%;display:block}
.wm{position:absolute;left:0;right:70px;top:40%;text-align:center;font-size:clamp(40px,7vw,96px);font-weight:700;letter-spacing:-1px;color:rgba(255,255,255,.022);pointer-events:none;user-select:none;white-space:nowrap;overflow:hidden;z-index:0}
.banner{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);background:var(--raised);border:1px solid var(--line2);color:var(--t2);
  padding:7px 8px 7px 14px;border-radius:8px;font-size:12.5px;z-index:5;display:flex;gap:12px;align-items:center;width:max-content;max-width:calc(100% - 24px);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.banner b{color:var(--t1);font-weight:600}
.banner button{color:var(--accent2);font-weight:600;white-space:nowrap;display:flex}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:4}
.loading::after{content:"";width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--accent2);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.jump{position:absolute;z-index:6;right:76px;bottom:38px;width:28px;height:28px;border-radius:6px;background:var(--tip);color:var(--t1);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.jump:hover{background:#262b33}
/* toolbar for the selected drawing */
.dbar{position:absolute;z-index:6;left:50%;top:10px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:4px;background:var(--raised);border:1px solid var(--line2);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.dbar .sw{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center}
.dbar .sw i{width:14px;height:14px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.dbar .sw.on{background:var(--hover);box-shadow:inset 0 0 0 1px var(--line2)}
.dbar .tb{height:28px;padding:0 7px;font-size:12px}
.dbar .tb.del{color:var(--down)}
.dbar .sep{height:18px;margin:0 3px}

/* auto analysis summary */
.autoinfo{position:absolute;z-index:5;right:76px;top:8px;max-width:330px;background:rgba(15,17,21,.94);border:1px solid var(--line2);border-radius:8px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.ai-h{display:flex;align-items:center;gap:8px;height:30px;padding:0 4px 0 10px;white-space:nowrap}
.ai-h b{font-weight:600;color:#e6b259}
.ai-h span{color:var(--t1);overflow:hidden;text-overflow:ellipsis}
.ai-h button{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:4px;color:var(--t2);margin-left:auto}
.ai-h button:hover{background:var(--hover)}
.ai-h svg{width:15px;height:15px;transition:transform .15s}
.autoinfo.open .ai-h svg{transform:rotate(180deg)}
.ai-l{display:none;padding:2px 10px 8px;border-top:1px solid var(--line)}
.autoinfo.open .ai-l{display:block}
.ai-l .ai-r.sub{padding-left:14px}
#atip{position:fixed;z-index:60;max-width:270px;padding:8px 10px;border-radius:6px;background:#1c2027;border:1px solid rgba(255,255,255,0.08);box-shadow:0 6px 24px rgba(0,0,0,0.45);font-size:12px;line-height:1.45;color:#c9ccd3;pointer-events:none}
#atip b{display:flex;align-items:center;gap:6px;color:#e6e9ee;font-weight:600;margin-bottom:3px}
#atip b i{width:8px;height:8px;border-radius:2px;flex:none}
.ai-l .ai-r{display:grid;grid-template-columns:8px auto 1fr;align-items:center;gap:8px;height:24px}
.ai-l i{width:8px;height:8px;border-radius:2px}
.ai-l small{color:var(--t3);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-l p{margin:6px 0 0;color:var(--t3);font-size:11px}
.autoinfo.open .ai-l{max-height:min(62vh,560px);overflow-y:auto}
.ai-c{display:flex;gap:4px;padding:8px 0 6px;flex-wrap:wrap}
.ai-c button{height:22px;padding:0 6px;border-radius:5px;color:var(--t3);border:1px solid var(--line2);font-size:11px}
.ai-c button.on{color:var(--accent2);background:var(--active);border-color:transparent}
.ai-f{display:flex;align-items:center;gap:8px;margin-top:6px}
.ai-f p{flex:1;margin:0!important}
.ai-f .btn{height:26px;font-size:12px;white-space:nowrap}
/* watchlist / alerts tabs */
.wtabs{display:flex;gap:2px}
.wtabs button{height:28px;padding:0 9px;border-radius:6px;color:var(--t3);font-weight:600;font-size:13px}
.wtabs button:hover{color:var(--t1)}
.wtabs button.on{color:var(--t1);background:var(--hover)}
.arow{display:grid;grid-template-columns:20px minmax(0,1fr) 24px;align-items:center;gap:10px;height:44px;padding:0 8px 0 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.arow:hover{background:var(--hover)}
.arow b{display:block;font-weight:500}
.arow small{display:block;color:#ff9f1a;font-size:11.5px}
.arow.off small{color:var(--t3)}
.arow.off b{color:var(--t2)}
.arow .x{width:24px;height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--t3)}
.arow .x:hover{background:var(--tip);color:var(--t1)}
.arow .x svg{width:14px;height:14px}
.dlg.small{width:min(380px,100%)}
.ahd{display:flex;align-items:center;gap:8px;margin:4px 0 14px}
.ahd b{font-weight:600}.ahd span{margin-left:auto;color:var(--t2)}
.alab{display:flex;flex-direction:column;gap:6px;color:var(--t3);font-size:12px;margin-bottom:6px}
.alab input{height:38px;background:var(--pane);border:1px solid var(--line2);border-radius:6px;color:var(--t1);padding:0 10px;font:inherit;font-size:16px;outline:0}
.alab input:focus{border-color:var(--accent)}
/* chart legend */
.legend{position:absolute;inset:0;pointer-events:none;z-index:3}
.lg{position:absolute;left:8px;display:flex;flex-direction:column;align-items:flex-start;gap:0;max-width:calc(100% - 96px)}
.lg-t{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:10px;row-gap:2px;padding:4px 4px 3px;font-size:12px;color:var(--t2)}
.lg-t .nm{font-size:13px;font-weight:500;color:var(--t1)}
.lg-t .tf{color:var(--t2)}
.lg-t em{font-style:normal;color:var(--t3);margin-right:3px}
.lg-r{display:flex;align-items:center;gap:7px;height:22px;padding:0 4px;border-radius:4px;pointer-events:auto;max-width:100%;border:1px solid transparent;font-size:12px;cursor:default;white-space:nowrap}
.lg-r:hover,.lg-r.open{background:rgba(15,17,21,.94);border-color:var(--line2)}
.lg-r .n{color:var(--t1)}
.lg-r .p{color:var(--t3)}
.lg-r .vs{display:flex;gap:8px;overflow:hidden}
.lg-r .a{display:none;gap:1px;margin-left:2px}
.lg-r:hover .a,.lg-r.open .a{display:flex}
.lg-r .a button{width:22px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:4px;color:var(--t2)}
.lg-r .a button:hover{color:var(--t1);background:var(--tip)}
.lg-r .a svg{width:15px;height:15px}
.lg-r.off .n,.lg-r.off .p,.lg-r.off .vs{opacity:.35}

/* bottom bar under the chart */
.bot{display:flex;align-items:center;gap:2px;padding:0 6px;min-width:0;overflow:hidden}
.bt{height:24px;padding:0 8px;border-radius:5px;color:var(--t2);font-size:12px;font-weight:500;white-space:nowrap}
.bt:hover{background:var(--hover);color:var(--t1)}
.bt.on{color:var(--accent2);background:var(--active)}
.bot .sep{height:16px;margin:0 4px}
.bot.alt #ranges,.bot.alt .bt,.bot.alt .sep{display:none!important}
.clock{color:var(--t2);font-size:12px;padding:0 6px;white-space:nowrap}

/* watchlist */
.wp{display:flex;flex-direction:column;min-height:0;min-width:0}
.wtop{display:flex;align-items:center;height:40px;padding:0 6px 0 12px;flex:none}
.wtop .t{font-weight:600;font-size:13px;flex:1}
.wcols,.row{display:grid;grid-template-columns:minmax(0,1fr) 92px 66px;align-items:center;column-gap:8px}
.wcols{padding:0 12px 6px;color:var(--t3);font-size:11px;font-weight:500;flex:none}
.wcols span:not(:first-child),.row .n{text-align:right}
.wl{overflow-y:auto;flex:1;min-height:120px;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#262a31 transparent;border-top:1px solid var(--line)}
.grp{display:flex;align-items:center;gap:6px;height:28px;padding:0 12px;color:var(--t3);font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;user-select:none}
.grp:hover{color:var(--t2)}
.grp svg{width:12px;height:12px;transition:transform .15s}
.grp.closed svg{transform:rotate(-90deg)}
.row{padding:0 12px 0 10px;height:30px;cursor:pointer;position:relative;border-left:2px solid transparent}
.row:hover{background:var(--hover)}
.row.on{background:rgba(20,46,97,.45);border-left-color:var(--accent)}
.row .s{display:flex;align-items:center;gap:8px;min-width:0}
.row .s .ic{width:18px;height:18px;font-size:8px}
.row .s b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.row .s b i{font-style:normal;font-weight:400;color:var(--t3);font-size:11px;margin-left:1px}
.row .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;border-radius:3px;padding:2px 0}
.row .n.chg{display:none}
.row .n.dim{color:var(--t3);font-size:11px}
.row .x{position:absolute;right:4px;top:5px;width:20px;height:20px;border-radius:4px;display:none;align-items:center;justify-content:center;background:var(--tip);color:var(--t2)}
.row .x:hover{color:var(--t1)}
.row .x svg{width:13px;height:13px}
.row:hover .x{display:flex}
.row.drag{opacity:.4}
.row.over{box-shadow:inset 0 2px 0 var(--accent)}
.flash-up{animation:fu .3s ease-out}.flash-down{animation:fd .3s ease-out}
@keyframes fu{0%{background:rgba(39,173,117,.22)}100%{background:transparent}}
@keyframes fd{0%{background:rgba(240,97,109,.22)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.flash-up,.flash-down{animation:none}}

/* details of the open symbol: same panel, split by one rule */
.det{border-top:1px solid var(--line);padding:12px 12px 14px;flex:none}
.det .hd{display:flex;align-items:center;gap:8px}
.det .hd .ic{width:20px;height:20px;font-size:9px}
.det .hd b{font-size:14px;font-weight:600}
.det .hd small{font-size:12px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.det .big{display:flex;align-items:center;gap:10px;margin:10px 0 0;flex-wrap:wrap}
.det .big .px{font-size:28px;line-height:32px;font-weight:600;letter-spacing:-.5px}
.det .big .ch{font-size:13px;font-weight:500;padding:3px 7px;border-radius:4px}
.det .big .ch.up{background:var(--up-bg)} .det .big .ch.down{background:var(--down-bg)}
.det .sub{font-size:11px;color:var(--t3);margin-top:2px}
.det .rng{margin:12px 0 2px}
.det .bar{height:4px;border-radius:2px;background:var(--line2);position:relative}
.det .bar i{position:absolute;top:-3px;width:2px;height:10px;border-radius:1px;background:var(--t1)}
.det .rng .vv{display:flex;justify-content:space-between;font-size:11px;color:var(--t3);margin-top:6px}
.det .rng .vv b{font-weight:400;color:var(--t2)}
.det .kv{display:grid;grid-template-columns:1fr auto;margin-top:6px;font-size:12px}
.det .kv span{height:26px;display:flex;align-items:center;border-bottom:1px solid var(--line)}
.det .kv span:nth-child(odd){color:var(--t3)}
.det .kv span:nth-child(even){justify-content:flex-end;color:var(--t1)}
.det .perf{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:10px}
.det .perf div{border-radius:4px;padding:5px 0 6px;text-align:center;background:var(--hover);font-size:12px;font-weight:500}
.det .perf div small{display:block;font-size:11px;font-weight:400;color:var(--t3);margin-bottom:1px}
.det .perf div.up{background:var(--up-bg)} .det .perf div.down{background:var(--down-bg)}
.det .note{margin:10px 0 0}

/* coin icons */
.ic{width:20px;height:20px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;overflow:hidden;background:#262a31}
.ic img{width:100%;height:100%;object-fit:cover}

/* dialogs */
.scrim{position:fixed;inset:0;background:rgba(4,5,7,.6);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:64px 16px 16px}
.dlg{background:var(--raised);border:1px solid var(--line2);border-radius:10px;width:min(600px,100%);max-height:calc(100dvh - 96px);display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.6);overflow:hidden}
.dh{display:flex;align-items:center;height:48px;padding:0 8px 0 16px;font-size:15px;font-weight:600;flex:none}
.dh .tb{height:30px;padding:0 6px}
.sbox{display:flex;align-items:center;gap:8px;margin:0 12px 10px;padding:0 10px;height:38px;border:1px solid var(--line2);background:var(--pane);border-radius:6px;color:var(--t3);flex:none}
.sbox:focus-within{border-color:var(--accent)}
.sbox input{flex:1;background:none;border:0;outline:0;color:var(--t1);font:inherit;font-size:14px;min-width:0}
.chips{display:flex;gap:4px;padding:0 12px 10px;overflow-x:auto;flex:none;scrollbar-width:none}
.chip{height:26px;padding:0 10px;border-radius:5px;color:var(--t2);font-size:12px;font-weight:500;white-space:nowrap}
.chip:hover{color:var(--t1);background:var(--hover)}
.chip.on{background:var(--active);color:var(--accent2)}
.list{overflow-y:auto;border-top:1px solid var(--line);flex:1;overscroll-behavior:contain}
.sr{display:grid;grid-template-columns:24px minmax(0,1fr) auto 28px;align-items:center;gap:10px;height:48px;padding:0 8px 0 16px;cursor:pointer;border-bottom:1px solid var(--line)}
.sr:hover,.sr.sel{background:var(--hover)}
.sr .ic{width:24px;height:24px;font-size:10px}
.sr b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr .d{color:var(--t3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr .r{text-align:right;font-size:12px;color:var(--t3);white-space:nowrap}
.sr .r .p{color:var(--t1);font-size:13px}
.sr .add{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--t2)}
.sr .add:hover{background:var(--tip);color:var(--t1)}
.sr .add.in{color:var(--accent2)}
.empty{padding:24px 16px;color:var(--t3);text-align:center}
.sec{padding:12px 16px 6px;color:var(--t3);font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.ir{display:flex;align-items:center;gap:12px;height:40px;padding:0 16px;cursor:pointer;border-bottom:1px solid var(--line)}
.ir:hover{background:var(--hover)}
.ir b{font-weight:500;min-width:76px}
.ir .d{color:var(--t3);font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.act.hl{background:var(--active)}
.act b{min-width:76px;font-weight:500}
.act input[type=text]{width:120px;background:var(--pane);border:1px solid var(--line2);border-radius:5px;color:var(--t1);padding:5px 8px;font:inherit}

  f.append(h('h4', {text:'Chart type'}), seg);
  f.append(h('h4', {text:'Sync between PC and phone'}));
  if (!SYNC_URL) { f.append(h('p', {class:'note', text:'Sync is not set up yet. Everything is saved in this browser.'})); return; }
  const url = location.origin + location.pathname + '#k=' + S.key;
  f.append(h('p', {class:'note', text:'Your watchlist, indicators and drawings sync on their own. To get them on another device, scan this code with it or open the link there. Anyone with the link can see and change your charts, so keep it to yourself.'}));
  const row = h('div', {class:'frow', style:'align-items:flex-start'});
  if (window.qrcode) { const qr = qrcode(0, 'M'); qr.addData(url); qr.make(); const d = h('div', {class:'qr'}); d.innerHTML = qr.createSvgTag({cellSize:4, margin:0}); row.append(d); }
  row.append(h('div', {style:'display:flex;flex-direction:column;gap:8px'},
    h('button', {class:'btn pri', text:'Copy sync link', onclick:async () => { try { await navigator.clipboard.writeText(url); toast('Link copied. Open it on your other device.'); } catch { prompt('Copy this link', url); } }}),
    h('button', {class:'btn', text:'Sync now', onclick:() => pull(true)}),
    h('span', {class:'note', id:'syncInfo', text:syncInfo()})));
  f.append(row);
}

// ---------- sync ----------
let pushT = null, syncState = 'idle', lastSync = 0;
function syncInfo(){ return syncState === 'err' ? 'Last sync failed, retrying' : lastSync ? 'Synced at ' + new Date(lastSync).toLocaleTimeString() : 'Not synced yet'; }
function setSync(st){ syncState = st; $('#syncDot').className = 'dot' + (st === 'ok' ? ' ok' : st === 'busy' ? ' busy' : st === 'err' ? ' err' : '');
  $('#syncTxt').textContent = !SYNC_URL ? 'Saved on this device' : st === 'err' ? 'Sync error' : st === 'busy' ? 'Syncing…' : 'Synced';
  $('#sync').title = SYNC_URL ? syncInfo() : 'Everything is saved in this browser';
  const i = $('#syncInfo'); if (i) i.textContent = syncInfo(); }
function schedulePush(){ if (!SYNC_URL) return; setSync('busy'); clearTimeout(pushT); pushT = setTimeout(push, 1500); }
async function push(){
  try {
    const r = await fetch(SYNC_URL + '/v1/' + S.key, {method:'PUT', headers:{'content-type':'application/json'}, body: JSON.stringify({meta:S.meta, draws:S.draws})});
    if (!r.ok) throw 0; lastSync = Date.now(); setSync('ok');
  } catch { setSync('err'); clearTimeout(pushT); pushT = setTimeout(push, 15000); }
}
function merge(remote){
  let changed = false, needPush = false;
  const rt = remote.meta && remote.meta.t || 0, lt = S.meta.t || 0;
  if (rt > lt) { S.meta = cleanMeta(remote.meta); changed = true; } else if (lt > rt) needPush = true;
  const rd = remote.draws && typeof remote.draws === 'object' ? remote.draws : {};
  for (const [id, d] of Object.entries(rd)) { if (!d || !Array.isArray(d.o)) continue; const l = S.draws[id];
    if (!l || (d.t || 0) > (l.t || 0)) { S.draws[id] = d; changed = true; } else if ((l.t || 0) > (d.t || 0)) needPush = true; }
  for (const id of Object.keys(S.draws)) if (!rd[id]) needPush = true;
  return {changed, needPush};
}
async function pull(manual){
  if (!SYNC_URL) return;
  if (pushT && syncState === 'busy') return;   // a local change is about to upload
  setSync('busy');
  try {
    const r = await fetch(SYNC_URL + '/v1/' + S.key, {cache:'no-store'}); if (!r.ok) throw 0;
    const remote = await r.json();
    const before = JSON.stringify([S.meta, S.draws[idOf(curItem())]]);
    const {changed, needPush} = merge(remote || {});
    persist(); lastSync = Date.now(); setSync('ok');
    if (changed && JSON.stringify([S.meta, S.draws[idOf(curItem())]]) !== before) { chart.setStyles(chartStyles()); buildIndicators(); openChart(); refreshPrices(); }
    if (needPush) schedulePush();
    if (manual) toast('Synced', 1200);
  } catch { setSync('err'); }
}

// ---------- phone tabs ----------
let tabNow = 'c';
function setTab(t){
  tabNow = t;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  $('#app').classList.toggle('show-w', t === 'w');
  if (t === 's') openSearch('');
  if (t === 'i') openInd();
  if (t === 'c' || t === 'w') { $('#searchDlg').hidden = $('#indDlg').hidden = true; }
  if (t === 'c') requestAnimationFrame(() => chart.resize());
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
$('#penBtn').onclick = () => { const o = $('#tools').classList.toggle('open'); $('#penBtn').classList.toggle('on', o); $('#app').classList.toggle('tools-open', o); if (!o) setTool('cursor'); };
$('#editBtn').onclick = () => { const on = $('#wp').classList.toggle('edit'); $('#editBtn').textContent = on ? 'Done' : 'Edit'; };

// ---------- start ----------
S = loadState();
const km = location.hash.match(/[#&]k=([\w-]{20,})/);
if (km) {   // opened from a sync link: adopt that key and take the synced copy
  if (km[1] !== S.key) { S.key = km[1]; S.meta.t = 0; for (const d of Object.values(S.draws)) d.t = 0; }
  history.replaceState(null, '', location.pathname);
}
persist();
chart.setStyles(chartStyles()); applyScale();
buildTools(); buildIndicators(); setSync('idle'); renderAlerts();
tickClock(); setInterval(tickClock, 1000);
openChart();
refreshPrices();
setInterval(() => { if (!document.hidden) refreshPrices(); }, 30000);
if (SYNC_URL) { pull(); setInterval(() => { if (!document.hidden) pull(); }, 60000); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) { refreshPrices(); pull(); } });
new ResizeObserver(() => { chart.resize(); positionLegend(); paintQuote(); }).observe($('#stage'));
if (document.fonts) document.fonts.ready.then(() => chart.setStyles(chartStyles()));
})();
</script>
</body>
